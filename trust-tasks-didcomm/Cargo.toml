[package]
name = "trust-tasks-didcomm"
version = "0.5.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "DIDComm v2.1 transport binding for the Trust Tasks framework, built on affinidi-messaging-didcomm. Provides pack/unpack helpers and a TransportHandler that maps the verified envelope sender into the framework's §4.8.1 precedence."
keywords = ["trust-tasks", "didcomm", "affinidi", "did", "transport"]
categories = ["network-programming", "cryptography"]
publish = true

[dependencies]
trust-tasks-rs = { path = "../trust-tasks-rs", version = "0.5" }
affinidi-messaging-didcomm = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
# Heavy: pulls in the full mediator + SDK + TDK. The mediator
# integration test that depends on these is gated `#[ignore]` so a
# default `cargo test` skips it (and the compile cost falls only on
# developers who opt in with `cargo test -- --ignored`).
affinidi-messaging-test-mediator = "0.2"
affinidi-messaging-sdk = "0.18"
affinidi-tdk = "0.7"
affinidi-tdk-common = "0.6"
affinidi-messaging-didcomm = "0.15"
affinidi-secrets-resolver = "0.5"
serde_json = "1"
