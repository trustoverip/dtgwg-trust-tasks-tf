[package]
name = "trust-tasks-didcomm"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94"
license.workspace = true
repository.workspace = true
description = "DIDComm v2.1 transport binding for the Trust Tasks framework, built on affinidi-messaging-didcomm. Provides pack/unpack helpers and a TransportHandler that maps the verified envelope sender into the framework's §4.8.1 precedence."
keywords = ["trust-tasks", "didcomm", "affinidi", "did", "transport"]
categories = ["network-programming", "cryptography"]

[dependencies]
trust-tasks-rs = { path = "../trust-tasks-rs", version = "0.1" }
affinidi-messaging-didcomm = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
