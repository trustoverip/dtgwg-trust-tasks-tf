[package]
name = "trust-tasks-proof-affinidi"
version = "0.1.0"
edition.workspace = true
rust-version = "1.94" # affinidi-data-integrity declares MSRV 1.94
license.workspace = true
repository.workspace = true
description = "ProofVerifier impl for the Trust Tasks framework, backed by the Affinidi Data Integrity crate. Supports eddsa-rdfc-2022 and eddsa-jcs-2022 cryptosuites."
keywords = ["trust-tasks", "data-integrity", "affinidi", "did", "proof"]
categories = ["cryptography", "authentication"]

[dependencies]
trust-tasks-rs = { path = "../trust-tasks-rs", version = "0.1" }
affinidi-data-integrity = "0.6"
affinidi-crypto = "0.1"
affinidi-encoding = "0.1"
affinidi-did-resolver-cache-sdk = "0.8"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
affinidi-secrets-resolver = "0.5"
affinidi-did-common = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
