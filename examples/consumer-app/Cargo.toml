[package]
name = "trust-tasks-example-consumer-app"
version = "0.0.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Example application: generates the three Trust Tasks it pins in trust-tasks.lock at build time, with trust-tasks-build."
publish = false

[dependencies]
# The runtime only: `default-features = false` leaves out every prebuilt
# specification family. The tasks this application speaks are generated by
# build.rs from the bundles under trust-tasks/.
trust-tasks-rs = { path = "../../trust-tasks-rs", default-features = false }
# For this application's own JSON handling; the generated code does not need
# it (it reaches serde_json through trust_tasks_rs::__private).
serde_json = "1"

[build-dependencies]
trust-tasks-build = { path = "../../trust-tasks-build" }
