registry = "https://trusttasks.org"

# A third-party source (SPEC §6.5). Its one bundle here,
# trust-tasks/@acme/payments/settle/1.0.bundle.json, is a test fixture; the
# lock and vendored bundles are what generation reads, so nothing is fetched.
[sources.acme]
url = "https://tasks.example.com"

[tasks]
"acl/grant" = "0.2"
"acme:payments/settle" = "1.0"
"keys/list" = "0.2"
"vault/get" = "0.3"
