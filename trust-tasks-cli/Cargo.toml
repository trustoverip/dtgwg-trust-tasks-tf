[package]
name = "trust-tasks-cli"
# A new crate's first version. From here on release-plz assigns it, as it does
# for every other crate (RELEASING.md). The first crates.io publish is manual:
# trusted publishing cannot create a crate that does not exist yet.
version = "0.1.3"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "The `trust-tasks` command: pin the Trust Task specifications an application uses, vendor their registry bundles by digest, and verify them in CI."
homepage = "https://trusttasks.org/"
readme = "README.md"
keywords = ["trust-tasks", "trustoverip", "cli", "lockfile", "codegen"]
categories = ["command-line-utilities", "development-tools::build-utils"]
publish = true

[[bin]]
name = "trust-tasks"
path = "src/main.rs"
# No rustdoc pages: the binary would document to target/doc/trust_tasks and
# collide with the `trust-tasks` facade crate, and its doc comments are clap
# `--help` text, not API docs.
doc = false

[dependencies]
anyhow = "1"
# The identity rules a lock is held to (shared with generation, so a lock this
# CLI writes is one the generator accepts) and, with `publish`, the bundle
# builder behind `trust-tasks registry build` — the one the official registry
# is built with.
trust-tasks-build = { path = "../trust-tasks-build", version = "0.1", features = ["publish"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Reads trust-tasks.lock. The lock is written by hand (src/lock.rs), so its
# layout is exactly the documented one.
toml = "1"
# Edits trust-tasks.toml in place, keeping the author's comments and layout.
toml_edit = "0.25"
# Small blocking HTTP client: rustls on ring with the Mozilla roots
# (webpki-roots), no async runtime. gzip because CloudFront compresses JSON.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
tempfile = "3"
# A mock https source for tests/sources.rs: a CA and a certificate it issues,
# served with rustls on ring (the provider ureq already uses).
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
