[package]
name = "trust-tasks-build"
# A new crate's first version. From here on it is assigned by the Release PR.
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Build-time generator for Trust Tasks: turns the specification versions an application pins in trust-tasks.lock into Rust types for trust-tasks-rs."
homepage = "https://trusttasks.org/"
documentation = "https://docs.rs/trust-tasks-build"
keywords = ["trust-tasks", "trustoverip", "codegen", "build", "json-schema"]
categories = ["development-tools::build-utils"]
publish = true

[features]
# The publisher's side: build registry bundles from a `specs/` tree (front
# matter, `$ref` inlining, lifecycles, the served layout). Used by the
# repository's trust-tasks-codegen and by `trust-tasks registry build`; an
# application's build script never needs it.
publish = ["dep:serde-saphyr"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.10"
typify = "0.6"
# Pinned to 0.8 by `typify`: the root schema is handed to typify as a
# `schemars::RootSchema`, so the majors must match (see trust-tasks-codegen).
schemars = "0.8"
prettyplease = "0.2"
syn = { version = "2", features = ["full", "visit-mut"] }
proc-macro2 = "1"
quote = "1"
heck = "0.5"
# Front matter (`publish` only). Safe-Rust YAML; serde_yaml pulls the
# unmaintained unsafe-libyaml (RUSTSEC-2024-0449).
serde-saphyr = { version = "1", optional = true }

[dev-dependencies]
serde-saphyr = "1"

[package.metadata.docs.rs]
all-features = true
