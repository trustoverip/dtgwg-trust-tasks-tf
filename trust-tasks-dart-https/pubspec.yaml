name: trust_tasks_https
# 60-180 characters: pub.dev scores a description outside that window as a
# failed pubspec check, because search results only show the first part of it.
description: >-
  The Trust Tasks HTTPS transport binding for Dart: a typed client and a
  framework-agnostic server running the SPEC section 7.2 pipeline per request.
version: 0.2.0
repository: https://github.com/trustoverip/dtgwg-trust-tasks-tf
issue_tracker: https://github.com/trustoverip/dtgwg-trust-tasks-tf/issues
documentation: https://trusttasks.org/implementations

environment:
  # The same floor as trust_tasks. package:http 1.2.1 is the first 1.x that
  # declares it.
  sdk: ^3.3.0

dependencies:
  # The floor is the oldest published core this package's lib/ and example/
  # compile against; the `packages` job in dart.yml checks it with
  # `dart pub downgrade`. Raise it when this package starts using newer core API.
  # 0.9.23: trust_task_discovery/v0_4 (added in 0.9.22; 0.9.11-0.9.22 never
  # reached pub.dev, so 0.9.23 is the first core that has it).
  trust_tasks: ^0.10.0
  # The client only. It runs on the web and in Flutter as well as the VM; the
  # server's dart:io adapter lives in a separate library so that it does not
  # take the web away from the client.
  http: ^1.2.1

dev_dependencies:
  # ^4, not ^5: lints 5 requires SDK 3.5, and this package's floor is 3.3.
  lints: ^4.0.0
  test: ^1.25.0
