# The generated tree under lib/specs/ is held to the same bar as the
# hand-written runtime: there is no exclusion here, and `dart analyze` runs over
# everything in CI. A generator that emits code failing the project's own lints
# is a generator to fix, not a tree to exempt.
include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Generated doc comments are lifted verbatim from schema descriptions, which
    # are prose written for spec readers. They occasionally mention a member name
    # that Dartdoc cannot resolve to a symbol; that is not worth failing a build.
    comment_references: ignore
    # Every prebuilt specification library is deprecated (build-dart-bindings.mjs,
    # milestone 5 of docs/design/consumer-side-generation.md) so that an
    # application importing one is told to generate it instead. This package's
    # own tests and smoke test still exercise them, and SDKs before 3.4 report
    # that same-package use, which the 3.3 floor job's --fatal-infos would fail.
    deprecated_member_use_from_same_package: ignore
