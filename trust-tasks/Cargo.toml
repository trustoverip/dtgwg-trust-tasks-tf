[package]
name = "trust-tasks"
# Released in release-plz's `core` version group with `trust-tasks-rs` and the
# crates that expose its types, so this crate's version is theirs: one number at
# the front door. (`trust-tasks-ceremony` versions on its own; its requirement
# is in `[dependencies]` below.) Never edit it by hand — RELEASING.md.
version = "0.39.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "One-dependency front door to the Trust Tasks framework: re-exports trust-tasks-rs plus the transport, proof, ceremony and capability crates behind Cargo features."
homepage = "https://trusttasks.org/"
documentation = "https://docs.rs/trust-tasks"
readme = "README.md"
keywords = ["trust-tasks", "trustoverip", "did", "transport", "verifiable"]
categories = ["data-structures", "network-programming"]
publish = true

[features]
# `all-specs` is the ONLY spec-family feature forwarded from `trust-tasks-rs`.
# That crate has one feature per prebuilt family (`vault`, `acl`, …); forwarding
# each one through here would put dozens more names in front of the newcomer this crate
# exists to help, and would still be the wrong tool for the job — Cargo unifies
# features across the graph, so a consumer trimming spec families has to be the
# only thing in the graph asking for them. Trimming spec families is therefore a
# reason to depend on `trust-tasks-rs` DIRECTLY and skip this crate. The umbrella
# is forwarded for a consumer that still uses the prebuilt modules.
#
# `default` is empty (#1102). `all-specs` compiles every prebuilt module, all
# deprecated since milestone 5 of docs/design/consumer-side-generation.md, in
# a ~17 GB build; a plain dependency on this crate gets the runtime alone, and
# an application generates the tasks it speaks with `trust-tasks-build`. Nothing
# else belongs in `default` either: `validate`, the transports, the proof backend
# and the rest are each a choice, and each pulls a dependency tree of its own.
default = []
all-specs = ["trust-tasks-rs/all-specs"]

# Runtime JSON Schema validation of payloads (pulls in `jsonschema`).
validate = ["trust-tasks-rs/validate"]

# ── Transports. One feature per binding; each pulls a different heavy
# dependency tree, which is why they are separate crates in the first place.
https = ["dep:trust-tasks-https"]
didcomm = ["dep:trust-tasks-didcomm"]
didcomm-v1 = ["dep:trust-tasks-didcomm-v1"]
tsp = ["dep:trust-tasks-tsp"]
# Every transport at once. Convenience for a gateway that bridges bindings;
# not something an application normally wants.
all-transports = ["https", "didcomm", "didcomm-v1", "tsp"]

# Only genuinely-additive sub-features are forwarded. `trust-tasks-https`'s
# `client`/`server` are both ON by default and Cargo features are additive, so a
# `https-client` here could not turn `server` OFF — it would be a name that does
# nothing. Trimming a transport's own defaults (https `client`/`server`,
# didcomm-v1 `legacy-basic-message`, ceremony/proof backends) means depending on
# that crate directly with `default-features = false`.
https-jwt = ["https", "trust-tasks-https/jwt"]

# ── Proof verification. Named `proof-affinidi` rather than `proof` because the
# crate is a plug-in point: the backend is the choice, and a second backend
# would land as `proof-<name>` beside this one rather than change what `proof`
# means.
proof-affinidi = ["dep:trust-tasks-proof", "trust-tasks-proof/affinidi"]

# ── Trust Ceremonies (salted step digests, receipt checking).
ceremony = ["dep:trust-tasks-ceremony"]

# ── Wire helpers for the capability families (governance/capability/*,
# git-trust/*).
capability-client = ["dep:trust-tasks-capability-client"]

[dependencies]
# Core is unconditional: there is no useful configuration of this crate that
# does not include it, and gating it would just be a feature everyone turns on.
trust-tasks-rs = { path = "../trust-tasks-rs", version = "0.39", default-features = false }

trust-tasks-https = { path = "../trust-tasks-https", version = "0.39", optional = true }
trust-tasks-didcomm = { path = "../trust-tasks-didcomm", version = "0.39", optional = true }
trust-tasks-didcomm-v1 = { path = "../trust-tasks-didcomm-v1", version = "0.39", optional = true }
trust-tasks-tsp = { path = "../trust-tasks-tsp", version = "0.39", optional = true }
trust-tasks-proof = { path = "../trust-tasks-proof", version = "0.39", optional = true, default-features = false }
trust-tasks-ceremony = { path = "../trust-tasks-ceremony", version = "0.2", optional = true }
trust-tasks-capability-client = { path = "../trust-tasks-capability-client", version = "0.39", optional = true }

# Every feature but the spec families (`all-specs`): those are
# trust-tasks-rs's prebuilt modules, all deprecated, and documenting them costs
# more memory than docs.rs gives a build. trust-tasks-rs's own docs show one.
[package.metadata.docs.rs]
features = [
    "validate",
    "all-transports",
    "https-jwt",
    "proof-affinidi",
    "ceremony",
    "capability-client",
]
rustdoc-args = ["--cfg", "docsrs"]
