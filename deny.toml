# cargo-deny configuration for the trust-tasks-rs workspace.
#
# Run locally with:
#
#   cargo install cargo-deny
#   cargo deny check
#
# CI runs the same command in .github/workflows/rust.yml.

[graph]
all-features = true

# ─── Advisories ────────────────────────────────────────────────────────────
# Fail on any RUSTSEC advisory affecting our dep graph. `notice` is downgraded
# to `warn` so an upstream advisory with no fix yet doesn't immediately wedge
# main; we still see it in the log.
[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error 1.0.4 is unmaintained. It's a transitive dep
    # (typify → serde_tokenstream → proc-macro-error) and the
    # upstream replacement proc-macro-error2 hasn't been wired through
    # the typify dep chain yet. No active CVE, just maintenance status.
    "RUSTSEC-2024-0370",
    # rustls-pemfile is deprecated in favour of `rustls-pki-types`'s
    # built-in pem parsing. Transitive dep via the Affinidi messaging
    # SDK / mediator. Unmaintained advisory, no active vuln; upstream
    # migration is tracked in the Affinidi crates.
    "RUSTSEC-2025-0134",
]

# ─── Licenses ──────────────────────────────────────────────────────────────
# The crate is Apache-2.0; transitive deps should be permissively licensed
# and compatible with that grant. Unknown licenses fail the build so a new
# transitive dep can't sneak a copyleft license into the graph.
[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    # CDLA-Permissive-2.0 — Linux Foundation's permissive data license,
    # used by webpki-roots (Mozilla root CA bundle data). Permissive in
    # the same way our other allowed licenses are.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# ─── Bans ──────────────────────────────────────────────────────────────────
# We don't currently ban any crates by name; this section is here so it's
# obvious where to add one. Multiple versions of the same crate are warnings,
# not errors, because the typify/schemars ecosystem still pulls some dual
# copies (e.g. `syn` 1 + 2).
[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

# ─── Sources ───────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
