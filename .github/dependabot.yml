# Keeps the commit-SHA pins in .github/workflows current. Each `uses:` is
# pinned to a full commit SHA with the release it corresponds to in a comment;
# Dependabot moves both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
