name: Install the pinned Rust toolchain
description: >-
  Installs the toolchain the root rust-toolchain.toml names, with its
  components, and makes it the default (#1142). It replaces
  dtolnay/rust-toolchain with `toolchain: stable`, which floated to each new
  release, and which the file would have overridden on the first cargo call
  anyway. A job that must build at another toolchain (an MSRV job) sets
  RUSTUP_TOOLCHAIN instead of using this action.

runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found in rust-toolchain.toml"
          exit 1
        fi
        # With no argument, `rustup toolchain install` installs what the file
        # names, with its components and profile.
        rustup toolchain install
        rustup default "$channel"
        rustc --version
        cargo --version
        # What dtolnay/rust-toolchain set, kept so the builds behave as before.
        {
          echo "CARGO_INCREMENTAL=0"
          echo "CARGO_TERM_COLOR=always"
          echo "RUSTUP_MAX_RETRIES=10"
        } >> "$GITHUB_ENV"
