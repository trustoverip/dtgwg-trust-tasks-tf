name: Checks
# Node-only guards over the release rules: seconds each, nothing compiled.
#
# Unfiltered, like ts.yml and the others, so every job reports on every PR and
# can be a required check (a path-filtered job never reports on a PR outside its
# paths, and a required check then waits forever). `published-schemas` moved
# here from the path-filtered rust.yml for that reason (#1135).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A released specification is compiled into every library, so an in-place
  # edit that changes its generated types — or the policy constants its front
  # matter sets — is a breaking release of the whole core version group (#858,
  # #758 and #750 each cost a MINOR; #819's mid-enum insertion made 0.32.0
  # breaking). Caught here, on the pull request: a released version may change
  # only additively, and anything else is a new version.
  published-schemas:
    name: published schemas change only additively
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history AND tags: the comparison is against the last
          # trust-tasks-rs-v* release, and the script refuses to run without it.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      # The front matter is parsed with `yaml` (#1134).
      - run: npm ci --no-audit --no-fund
      - name: Check every released spec changed only additively
        env:
          PUBLISHED_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-published-schemas.mjs

  # Every publish job releases a version that is not on its registry yet, so a
  # version moved by an ordinary PR publishes the moment it merges — bypassing
  # the Release PR, and for Go and crates.io irreversibly (#1137). Only the
  # Release PR, from this repository's own `release` branch, may move one. A
  # skipped job reports success, so this can be required without holding up the
  # Release PR.
  version-edits:
    name: versions change only in the Release PR
    if: >-
      github.event_name == 'pull_request' &&
      !(github.head_ref == 'release' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge base with the PR's base branch.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Refuse a changed version declaration
        env:
          VERSION_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: npm run check-version-edits

  # The node tests of the checks above and of check-release-lists.mjs
  # (scripts/test-checks/).
  test-checks:
    name: check scripts' tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:checks
