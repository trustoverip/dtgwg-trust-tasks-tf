name: TypeScript

on:
  push:
    branches: [main]
  # No `branches:` filter. A PR based on another branch (a stacked PR) used to
  # run none of these jobs and report a green board made entirely of DCO and
  # licence checks, which is worse than reporting nothing.
  #
  # And no `paths:` filter, for the same reason one step further on: these jobs
  # are the guards that stop `trust-tasks-rs` and `trust-tasks-ts` disagreeing
  # about the wire contract, so they are worth being able to make *required*.
  # A path-filtered job cannot be required — on a PR that touches none of the
  # listed paths it never runs, reports no status, and a required check then
  # blocks that PR forever waiting for something that will never arrive. So the
  # filter and the requirement are mutually exclusive, and of the two it is the
  # requirement that carries its weight.
  #
  # The workflow is no longer cheap — it now builds Rust for the equivalence
  # checks and runs api-extractor over the whole package — but a skipped
  # required check is a correctness gap, and that is the dearer of the two.
  pull_request:

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that needs more asks for it by name.
permissions:
  contents: read

jobs:
  # The Rust bindings have `codegen-drift` (see codegen.yml) but the TS side
  # had no equivalent, so a spec change that regenerated only the Rust
  # modules could merge with stale `trust-tasks-ts/src` (exactly what
  # happened on the agent-name PR). This job is the TS mirror of that
  # guard: regenerate and fail if the committed output differs.
  bindings-drift:
    name: build-ts-bindings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate TS bindings
        run: npm run build-ts-bindings
      - name: Check for drift
        run: |
          # The name lock is generator output too: a run that names a new
          # shared component must commit it, or the next shape of that name
          # could rename it.
          #
          # `git status`, not `git diff`: a module the generator newly wrote is
          # untracked, and `git diff` cannot see an untracked file (codegen.yml).
          paths=(trust-tasks-ts/src trust-tasks-ts/component-names.lock.json)
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            echo "::error::TS bindings are stale. Run \`npm run build-ts-bindings\` and commit the diff (including new files and trust-tasks-ts/component-names.lock.json). Do NOT bump @openvtc/trust-tasks — the Release PR does that; see RELEASING.md."
            git status --short -- "${paths[@]}"
            git add -N -- "${paths[@]}"
            git diff -- "${paths[@]}" | head -400
            exit 1
          fi

  # ── Where the per-PR version-bump gate used to be ───────────────────────
  #
  # A job here required `trust-tasks-ts/package.json` to move whenever the
  # generated bindings changed, because publishing was a side effect of
  # merging: main and npm would otherwise hold the same version number with
  # different contents.
  #
  # That is no longer how the package is released. `scripts/release-pr.sh`
  # keeps a Release PR open with the bump the merged commits imply, and merging
  # it is what publishes — so main is legitimately ahead of npm between
  # releases, and a contributor bumping the version by hand would collide with
  # every other open PR. See RELEASING.md.

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install trust-tasks-ts dev dependencies
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Typecheck generated bindings
        working-directory: trust-tasks-ts
        run: npx tsc -p tsconfig.json --noEmit

  # The generated bindings are only types; the SPEC §7.2 consumer pipeline in
  # src/_runtime is hand-written, so unlike the rest of the package it can
  # regress without the drift guard noticing. These are the conformance tests
  # for it, and they mirror the set in trust-tasks-rs/src/consume.rs — the two
  # reference implementations must reach the same verdict on the same document.
  test:
    name: node --test (runtime)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install trust-tasks-ts dev dependencies
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Run the runtime conformance tests
        working-directory: trust-tasks-ts
        run: npm test

      # Imports the *built* package from Node, as a consumer does. `tsc
      # --noEmit` cannot see this failure mode: the package is ESM and Node
      # demands an explicit extension on a relative specifier, while
      # TypeScript's `Bundler` resolution accepts an extensionless one and
      # emits it verbatim. That shipped a broken root import for four releases
      # with every check green.
      - name: Smoke-test the built package
        working-directory: trust-tasks-ts
        run: npm run smoke

  # The hand-written packages built on @openvtc/trust-tasks: the Data Integrity
  # proof verifier. Each builds against the *published* @openvtc/trust-tasks
  # (its package.json depends on it), so a PR that needs unreleased core API
  # fails here until the core releases — the same discipline as the Dart
  # `packages` job.
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ["trust-tasks-ts-proof", "trust-tasks-ts-tsp", "trust-tasks-ts-capability-client"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A PR touching none of this package's inputs skips the steps below and
      # the job still reports success (it may be a required check, so the job
      # itself always runs). The inputs: the package, the core (installed from
      # npm, so this is a margin), the shared fixtures, and this workflow.
      # Push, dispatch and the Release PR always run in full; see
      # .github/actions/changed-paths (#1141).
      - name: Did this PR change this job's inputs?
        id: changes
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            ${{ matrix.package }}
            trust-tasks-ts
            fixtures
            .github/workflows/ts.yml
      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ matrix.package }}
        run: npm ci --no-audit --no-fund
      - name: Build
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ matrix.package }}
        run: npm run build
      - name: Typecheck tests
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ matrix.package }}
        run: npm run typecheck:test
      - name: Test
        if: steps.changes.outputs.run == 'true'
        working-directory: ${{ matrix.package }}
        run: npm test

  # Rust has cargo-semver-checks (`rs API compatibility`); this is the
  # TypeScript counterpart, on the PR so an undeclared break is caught when
  # it is made instead of shipping as a patch. It compares the PR's public
  # declarations — every .d.ts, since `exports` has `./*` — with the last
  # npm release, via api-extractor doc models. Removed or changed API fails
  # unless the PR title's `!` is scoped to `ts`; additions (a new spec
  # version, an optional member, a value appended to a string-literal union)
  # pass. Policy and method: trust-tasks-ts/scripts/api-compat.mjs.
  # About a minute; api-extractor peaks near 5 GB per side, run one at a time.
  api-compat:
    name: ts API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and tags: a break already declared since the published
          # release (trust-tasks-ts-v*) lets this PR's break through.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install trust-tasks-ts dev dependencies
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Test the compatibility policy
        working-directory: trust-tasks-ts
        run: node --test scripts/api-compat.test.mjs
      - name: Compare the public API with the last npm release
        working-directory: trust-tasks-ts
        # The title is read LIVE, not from the event payload: this workflow
        # does not run on `edited`, and "Re-run job" replays the original
        # payload — so after retitling a PR to `feat(ts)!:`, re-running this
        # job must see the new title. It reaches the script only through the
        # environment, never interpolated into `run:` (see commit-lint.yml).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title)
          export PR_TITLE
          npm run api-compat

  # The drift job above proves the generators were re-run. It compares each
  # generator's output to itself, so an output that is consistently wrong is
  # consistently clean — which is how the response-type drop (#174) and the
  # `Payload` alias (#215) both shipped green. This job asks the different
  # question: does the generated binding agree with the specification it came
  # from, and do the two languages agree with each other.
  conformance:
    name: bindings match specs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check bindings against specs
        run: npm run check-bindings
      # Every TypeScript and Dart sibling's core range admits the core in this
      # checkout, and no TypeScript sibling installs a core of its own. Both
      # drifted unnoticed (scripts/check-sibling-core-ranges.mjs).
      - name: Sibling packages admit the current core
        run: npm run check-sibling-core-ranges

  # Consumer-side generation (docs/design/consumer-side-generation.md,
  # milestone 3): trust-tasks-gen-ts generates modules from registry bundles.
  # This runs it over EVERY bundle and compares the result with the prebuilt
  # modules scripts/build-ts-bindings.mjs commits — every module and every
  # hoisted shared definition byte-identical, schemas JSON-equal in the same
  # member order, the generated tree type-checked. What it compares and the
  # differences it explains: trust-tasks-ts-gen/scripts/equivalence.mjs.
  gen-equivalence:
    name: trust-tasks-gen-ts equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
      # The bundles below need a release build of trust-tasks-codegen; it was
      # the one bundle-building job without a cache, so a cold build every run
      # (#1141). Save from `main` only, as everywhere else.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install trust-tasks-ts dev dependencies (tsc)
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Install
        working-directory: trust-tasks-ts-gen
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: trust-tasks-ts-gen
        run: npm test
      - name: Build the registry bundles
        run: cargo run -q --release -p trust-tasks-codegen -- --bundles "$RUNNER_TEMP/bundles"
      - name: Generate every bundle and compare with the prebuilt modules
        working-directory: trust-tasks-ts-gen
        run: npm run build && node scripts/equivalence.mjs --bundles "$RUNNER_TEMP/bundles" --work "$RUNNER_TEMP/equivalence"

  # An application that pins three registry tasks and one third-party task,
  # generates them with trust-tasks-gen-ts, type-checks, and runs a round trip
  # through the runtime — against the runtime in this checkout, because the
  # generated index calls `declareExtends`, which is newer than the last
  # release. The TypeScript twin of rust.yml's `consumer-app`.
  #
  # It also runs examples/getting-started-ts, the application behind
  # GETTING-STARTED.md §3 — a signed acl/grant round trip over HTTP that
  # asserts its own output — and holds that section's snippets to its source
  # (the TypeScript counterpart of trust-tasks/tests/getting_started_snippets.rs).
  consumer-app-ts:
    name: example application (trust-tasks-gen-ts)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build @openvtc/trust-tasks
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build @openvtc/trust-tasks-gen
        working-directory: trust-tasks-ts-gen
        run: npm ci --no-audit --no-fund && npm run build
      - name: Generate, build and run
        working-directory: examples/consumer-app-ts
        run: npm ci --no-audit --no-fund && npm run all
      - name: Build @openvtc/trust-tasks-proof
        working-directory: trust-tasks-ts-proof
        run: npm ci --no-audit --no-fund && npm run build
      - name: "Getting started: generate, build and run"
        working-directory: examples/getting-started-ts
        run: npm ci --no-audit --no-fund && npm run all
      - name: "Getting started: GETTING-STARTED.md §3 matches the example"
        run: node scripts/check-getting-started-snippets.mjs examples/getting-started-ts/src/main.ts
