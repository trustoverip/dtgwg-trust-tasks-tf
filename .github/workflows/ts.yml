name: TypeScript

on:
  push:
    branches: [main]
  # No `branches:` filter. A PR based on another branch (a stacked PR) used to
  # run none of these jobs and report a green board made entirely of DCO and
  # licence checks, which is worse than reporting nothing.
  #
  # And no `paths:` filter, for the same reason one step further on: these jobs
  # are the guards that stop `trust-tasks-rs` and `trust-tasks-ts` disagreeing
  # about the wire contract, so they are worth being able to make *required*.
  # A path-filtered job cannot be required — on a PR that touches none of the
  # listed paths it never runs, reports no status, and a required check then
  # blocks that PR forever waiting for something that will never arrive. So the
  # filter and the requirement are mutually exclusive, and of the two it is the
  # requirement that carries its weight.
  #
  # The whole workflow costs well under a minute (the four jobs ran 16s, 9s and
  # change on their last green board), which is not a price worth paying a
  # correctness gap for.
  pull_request:

jobs:
  # The Rust bindings have `codegen-drift` (see rust.yml) but the TS side
  # had no equivalent, so a spec change that regenerated only the Rust
  # modules could merge with stale `trust-tasks-ts/src` (exactly what
  # happened on the agent-name PR). This job is the TS mirror of that
  # guard: regenerate and fail if the committed output differs.
  bindings-drift:
    name: build-ts-bindings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate TS bindings
        run: npm run build-ts-bindings
      - name: Check for drift
        run: |
          if ! git diff --quiet trust-tasks-ts/src; then
            echo "::error::TS bindings are stale. Run \`npm run build-ts-bindings\` and commit the diff. Do NOT bump @openvtc/trust-tasks — the Release PR does that; see RELEASING.md."
            git diff trust-tasks-ts/src
            exit 1
          fi

  # ── Where the per-PR version-bump gate used to be ───────────────────────
  #
  # A job here required `trust-tasks-ts/package.json` to move whenever the
  # generated bindings changed, because publishing was a side effect of
  # merging: main and npm would otherwise hold the same version number with
  # different contents.
  #
  # That is no longer how the package is released. `scripts/release-ts-pr.sh`
  # keeps a Release PR open with the bump the merged commits imply, and merging
  # it is what publishes — so main is legitimately ahead of npm between
  # releases, and a contributor bumping the version by hand would collide with
  # every other open PR. See RELEASING.md.

  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install trust-tasks-ts dev dependencies
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Typecheck generated bindings
        working-directory: trust-tasks-ts
        run: npx tsc -p tsconfig.json --noEmit

  # The generated bindings are only types; the SPEC §7.2 consumer pipeline in
  # src/_runtime is hand-written, so unlike the rest of the package it can
  # regress without the drift guard noticing. These are the conformance tests
  # for it, and they mirror the set in trust-tasks-rs/src/consume.rs — the two
  # reference implementations must reach the same verdict on the same document.
  test:
    name: node --test (runtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install trust-tasks-ts dev dependencies
        working-directory: trust-tasks-ts
        run: npm ci --no-audit --no-fund
      - name: Run the runtime conformance tests
        working-directory: trust-tasks-ts
        run: npm test

      # Imports the *built* package from Node, as a consumer does. `tsc
      # --noEmit` cannot see this failure mode: the package is ESM and Node
      # demands an explicit extension on a relative specifier, while
      # TypeScript's `Bundler` resolution accepts an extensionless one and
      # emits it verbatim. That shipped a broken root import for four releases
      # with every check green.
      - name: Smoke-test the built package
        working-directory: trust-tasks-ts
        run: npm run smoke

  # The drift job above proves the generators were re-run. It compares each
  # generator's output to itself, so an output that is consistently wrong is
  # consistently clean — which is how the response-type drop (#174) and the
  # `Payload` alias (#215) both shipped green. This job asks the different
  # question: does the generated binding agree with the specification it came
  # from, and do the two languages agree with each other.
  conformance:
    name: bindings match specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check bindings against specs
        run: npm run check-bindings
