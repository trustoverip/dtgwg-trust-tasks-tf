name: Commit lint

# PRs here squash-merge, so the PR TITLE becomes the commit subject on `main`.
# Since the release-plz cut-over that subject does two jobs it did not do
# before:
#
#   1. it is the changelog entry every consumer of these packages reads, and
#   2. its conventional-commit TYPE decides how far the version moves — `feat`
#      and `!`/`BREAKING CHANGE` are what release-plz reads to size the bump.
#
# An unparseable title used to be untidy. Now it silently under-reports a
# release. This check is small on purpose: it lints the title, not the body.
#
# `spec` is in the allowed list although it is not a standard conventional
# type — it is this repo's most common one, for a change to a specification
# under `specs/`. cliff.toml gives it its own changelog group. Note that
# release-plz scores an unrecognised type as a PATCH, so use `feat(...)` when
# you add a spec family (additive API surface) and `spec(...)` for edits within
# an existing one.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  title:
    name: PR title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        # The title is passed through the environment, never interpolated into
        # the script body: `${{ }}` inside `run:` splices attacker-controlled
        # text straight into the shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|test|ci|build|perf|refactor|chore|security|spec|site|revert'
          # The scope allows commas and spaces because this repo really does
          # write `feat(rs, proof):` and `feat(didcomm,didcomm-v1,tsp):`.
          # git-cliff's conventional parser treats a multi-scope as
          # unconventional and files it under "Other", so prefer one scope —
          # but a title that reads correctly is not worth failing a PR over.
          if printf '%s' "$TITLE" | grep -qE "^($types)(\([a-z0-9._/, -]+\))?!?: .+"; then
            # `!` makes release-plz cut a BREAKING release of every crate in the
            # version group, and the npm/Go/Dart bump scripts do the same. It is
            # for a package's public API, so every scope must name a package. A
            # specification change never needs it: a released spec changes only
            # additively in place (check-published-schemas), and anything else is
            # a new version — a new module, an additive patch. 22 `!` titles on
            # spec changes (#858 among them, whose crate API did not change at
            # all) each cost every library a MINOR before this was enforced.
            if printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
              pkg='rs|ts|go|dart|codegen|runtime|bindings|https|didcomm|didcomm-v1|tsp|proof|ceremony|capability-client|(rs|ts|go|dart)-[a-z0-9-]+'
              scopes=$(printf '%s' "$TITLE" | sed -nE 's/^[a-z]+\(([^)]*)\)!:.*/\1/p' | tr ',' '\n' | sed 's/^ *//; s/ *$//')
              bad=$(printf '%s\n' "$scopes" | grep -vxE "$pkg" || true)
              if [ -z "$scopes" ] || [ -n "$bad" ]; then
                # shellcheck disable=SC2016 # the backticks are literal Markdown, not substitution
                printf '::error::`!` names a breaking change to a package API, but this title scopes it to: %s\n' "${bad:-(no scope)}"
                cat <<'EOF'
          `!` makes every crate in the release group — and the npm, Go and Dart
          packages — a BREAKING release. Use it only for a package's public API, and
          scope it to the package: feat(rs)!:  fix(codegen)!:  feat(ts)!:  feat(go-didcomm)!:

          A specification change never needs it. A released spec may change in place
          only additively (CI: published schemas change only additively); anything
          else goes in a NEW VERSION FOLDER, which is a new module — an additive
          patch for every library. Drop the `!`. See RELEASING.md.
          EOF
                exit 1
              fi
            fi
            echo "ok: $TITLE"
            exit 0
          fi
          # `<<'EOF'` (quoted delimiter) so NOTHING in the block is expanded.
          # An unquoted heredoc would run command substitution on a PR title
          # containing backticks or $(...) — attacker-controlled text executing
          # in the runner.
          printf '::error::PR title is not a conventional commit: %s\n' "$TITLE"
          cat <<'EOF'
          The title becomes the squashed commit subject on main, which is both the
          changelog entry consumers read and the signal release-plz uses to size the
          version bump. Format:

            <type>(<scope>)!: <summary>

          type   feat fix docs test ci build perf refactor chore security spec site revert
          scope  optional, e.g. (rs) (https) (vault) (ts-bindings); one is best
          !      optional, marks a breaking change to a PACKAGE API; scope it to the package

          Examples:
            feat(rs): add a trust-tasks facade crate
            fix(https): send the response payload the spec pairs with the request
            spec(vault): tighten the secretKind enum
            feat(rs)!: generated types are #[non_exhaustive]

          See RELEASING.md.
          EOF
          exit 1
