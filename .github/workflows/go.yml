name: Go

on:
  push:
    branches: [main]
  # No `branches:` filter, and no `paths:` filter, for the reasons spelled out at
  # length in ts.yml: a stacked PR would otherwise run none of these jobs and
  # report a green board made entirely of DCO and licence checks, and a
  # path-filtered job cannot be made a *required* check — on a PR touching none
  # of the listed paths it never runs, reports no status, and a required check
  # blocks that PR forever waiting for something that will never arrive.
  #
  # These jobs are the guards that stop trust-tasks-go disagreeing with
  # trust-tasks-rs and trust-tasks-ts about the wire contract, so they are worth
  # being able to make required.
  pull_request:

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain the single-version jobs use. The *minimum* the module supports
  # is the `go` directive in trust-tasks-go/go.mod, and the build/test matrix
  # below pins that value explicitly so the declared floor is proven rather than
  # asserted — a module that says `go 1.22` and only ever builds on stable will
  # happily accumulate a 1.25-ism nobody notices.
  GO_VERSION: "stable"

jobs:
  # The Go mirror of codegen.yml's `codegen-drift` and ts.yml's `bindings-drift`:
  # regenerate and fail if the committed output differs. A spec change that
  # regenerated only two of the three libraries is exactly the defect this
  # catches — it is what happened between Rust and TypeScript in #85 → #86.
  #
  # The generator gofmts its own output (see the note at the end of
  # scripts/build-go-bindings.mjs), so this compares like with like and a
  # contributor cannot introduce drift merely by not having Go installed.
  bindings-drift:
    name: build-go-bindings drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate Go bindings
        run: npm run build-go-bindings
      - name: Check for drift
        run: |
          if ! git diff --quiet trust-tasks-go/specs; then
            echo "::error::Go bindings are stale. Run \`npm run build-go-bindings\` and commit the diff. Do NOT bump a version — the Release PR does that; see RELEASING.md."
            git diff --stat trust-tasks-go/specs
            git diff trust-tasks-go/specs | head -200
            exit 1
          fi

  build:
    name: go build + vet (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the `go` directive in go.mod — the floor a consumer may be on.
        # `stable` is what most will actually use. Bump the first only together
        # with go.mod.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Build every generated package
        working-directory: trust-tasks-go
        run: go build ./...
      - name: Vet
        working-directory: trust-tasks-go
        run: go vet ./...
      # `gofmt -l` prints the files that are not formatted and exits 0 either
      # way, so the emptiness of its output is the assertion. Only on `stable`:
      # gofmt's output can differ between major Go versions, and the committed
      # tree is formatted by whatever the generator ran, so checking it on the
      # floor toolchain would assert something nobody promised.
      - name: gofmt
        if: matrix.go == 'stable'
        working-directory: trust-tasks-go
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  # The Go counterpart of cargo-semver-checks: compares the PR's API with the
  # last released trust-tasks-go/v* tag (apidiff over every package of the core
  # module) and fails an incompatible change the PR title does not declare with
  # `go` in a `!` scope. A Go tag cannot be retracted, so an undeclared break
  # shipped as a patch is permanent. The verdict, and the constant-value changes
  # it deliberately does not count, are in the script's header.
  api-compat:
    name: go API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags for the baseline, history for the "already breaking" check.
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install apidiff
        # golang.org/x/exp has no releases, only pseudo-versions: pinned to one.
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Compare with the last release
        # The title is read through the environment or the API, never
        # interpolated into the script body — see commit-lint.yml.
        #
        # This workflow does not trigger on `edited` (that would re-run, and via
        # the concurrency group cancel, every Go job on a description edit), and
        # a re-run replays the ORIGINAL event payload. So the title is fetched as
        # it is now: retitle the PR, then re-run this job, and it sees the new
        # title. The event's title is the fallback if the API is unreachable.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title) || PR_TITLE="$EVENT_TITLE"
          export PR_TITLE
          scripts/check-go-api-compat.sh

  # The generated packages are only types and constants; the SPEC §7.2 consumer
  # pipeline in trusttasks/ is hand-written, so unlike the rest of the module it
  # can regress without the drift guard noticing. These are its conformance
  # tests, and they mirror the sets in trust-tasks-rs/src/consume.rs and
  # trust-tasks-ts/test/ — the three reference implementations must reach the
  # same verdict on the same document.
  #
  # `./smoke` is the counterpart of `npm run smoke`: it imports a *generated*
  # package and drives the real pipeline with it, which is the one thing neither
  # the drift check nor the runtime tests do.
  test:
    name: go test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          # The module has no dependencies, so there is no go.sum to key a cache on.
          cache: false
      - name: Run the runtime conformance tests and the smoke test
        working-directory: trust-tasks-go
        run: go test -race ./...

  # The TSP transport binding is a SEPARATE Go module (trust-tasks-go/tsp) so the
  # core stays dependency-free — the jobs above run `./...` in trust-tasks-go,
  # which excludes a nested module, so none of them pulls affinidi-tsp-go. This
  # job builds, vets and tests that module on its own floor.
  #
  # It is NOT wired into a release: affinidi-tsp-go is required at a pseudo-version
  # (it has no tag yet), so a `trust-tasks-go/tsp/vX.Y.Z` release waits until it is
  # tagged. Until then `go get` of this module resolves the pseudo-version from
  # the public repo.
  tsp:
    name: go test trust-tasks-go/tsp (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.27 is the `go` directive in tsp/go.mod, inherited from affinidi-tsp-go.
        go: ["1.27", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build
        working-directory: trust-tasks-go/tsp
        run: go build ./...
      - name: Vet
        working-directory: trust-tasks-go/tsp
        run: go vet ./...
      - name: gofmt
        if: matrix.go == 'stable'
        working-directory: trust-tasks-go/tsp
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        working-directory: trust-tasks-go/tsp
        run: go test -race ./...

  # The Data Integrity proof backend is a SEPARATE Go module (trust-tasks-go/proof)
  # like tsp — the core `./...` jobs above do not reach it. Unlike tsp it pulls in
  # no third-party code (it rolls the cryptosuites on the standard library), so its
  # only requirement is the core module, and there is no unpublished dependency
  # blocking a release; wiring one is a follow-up.
  proof:
    name: go test trust-tasks-go/proof (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the `go` directive in proof/go.mod.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build
        working-directory: trust-tasks-go/proof
        run: go build ./...
      - name: Vet
        working-directory: trust-tasks-go/proof
        run: go vet ./...
      - name: gofmt
        if: matrix.go == 'stable'
        working-directory: trust-tasks-go/proof
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        working-directory: trust-tasks-go/proof
        run: go test -race ./...

  # The DIDComm v2 transport binding is a SEPARATE Go module
  # (trust-tasks-go/didcomm) like tsp and proof — the core `./...` jobs do not
  # reach it. It rolls DIDComm v2.1 authcrypt (ECDH-1PU + A256KW + A256CBC-HS512)
  # on the standard library's crypto/ecdh, so like proof it pulls in no
  # third-party code and needs only the core module. Not release-wired yet.
  didcomm:
    name: go test trust-tasks-go/didcomm (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the `go` directive in didcomm/go.mod.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build
        working-directory: trust-tasks-go/didcomm
        run: go build ./...
      - name: Vet
        working-directory: trust-tasks-go/didcomm
        run: go vet ./...
      - name: gofmt
        if: matrix.go == 'stable'
        working-directory: trust-tasks-go/didcomm
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        working-directory: trust-tasks-go/didcomm
        run: go test -race ./...

  # The capability wire client is a SEPARATE Go module
  # (trust-tasks-go/capabilityclient) like tsp/proof/didcomm, but pure wire logic
  # — no crypto, no transport, and no third-party dependency (only the core
  # module). The core `./...` jobs do not reach a nested module.
  capabilityclient:
    name: go test trust-tasks-go/capabilityclient (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.22 is the `go` directive in capabilityclient/go.mod.
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build
        working-directory: trust-tasks-go/capabilityclient
        run: go build ./...
      - name: Vet
        working-directory: trust-tasks-go/capabilityclient
        run: go vet ./...
      - name: gofmt
        if: matrix.go == 'stable'
        working-directory: trust-tasks-go/capabilityclient
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Test
        working-directory: trust-tasks-go/capabilityclient
        run: go test -race ./...

  # Consumer-side generation (docs/design/consumer-side-generation.md,
  # milestone 3): trust-tasks-go/cmd/trust-tasks-gen generates an application's
  # locked tasks from its vendored registry bundles. It is an independent port of
  # scripts/build-go-bindings.mjs, so this job runs it over EVERY bundle in the
  # registry (built here by the Rust codegen, as deploy.yml builds them) and
  # compares the result with the committed prebuilt tree under
  # trust-tasks-go/specs. The test's header lists the differences it permits —
  # the generated-by header and the key-sorted embedded schema (JSON-equal);
  # the bundle's `defsOrder` restores the `$defs` declaration order — and
  # every other difference fails it.
  consumer-generation-equivalence:
    name: trust-tasks-gen ≡ build-go-bindings (whole registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the registry bundles
        run: |
          cargo run -q --release -p trust-tasks-codegen -- --bundles "$RUNNER_TEMP/registry"
          echo "TRUST_TASKS_BUNDLES=$RUNNER_TEMP/registry" >> "$GITHUB_ENV"
      - name: Compare with the prebuilt packages
        working-directory: trust-tasks-go
        run: go test -count=1 -v -run Equivalence ./cmd/trust-tasks-gen

  # The example application: three tasks pinned in
  # examples/consumer-app-go/trust-tasks.lock (the same as examples/consumer-app),
  # generated by `go generate` through trust-tasks-gen, built and run — a round
  # trip through the runtime. The generated tree is committed, as go generate
  # output usually is, so regenerating must reproduce it byte for byte. Also on
  # the module's floor, because an application on 1.22 runs the generator on 1.22.
  consumer-app:
    name: example application (trust-tasks-gen, ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: go generate
        working-directory: examples/consumer-app-go
        run: go generate ./...
      - name: Check the committed generated tree
        run: |
          if [ -n "$(git status --porcelain examples/consumer-app-go)" ]; then
            echo "::error::examples/consumer-app-go/internal/tasks is stale. Run \`go generate ./...\` there and commit the result."
            git status --porcelain examples/consumer-app-go
            git diff examples/consumer-app-go | head -100
            exit 1
          fi
      - name: Vet and run
        working-directory: examples/consumer-app-go
        run: |
          go vet ./...
          go run .
