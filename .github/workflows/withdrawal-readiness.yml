name: Withdrawal readiness
# The quarterly withdrawal batch (withdraw.yml) removes every spec version
# superseded or retired for 90 days from the generated libraries. Hand-written
# code still importing one of those modules would stop the batch's PR from
# building. This lists every such use ahead of time: a warning while the batch
# is more than 30 days away, a failure inside that window
# (scripts/check-withdrawal-readiness.mjs). Weekly as well as per PR, so the
# countdown is visible on main even when nobody opens one.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readiness:
    name: next withdrawal batch builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: due dates come from when each successor was added.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: List hand-written uses of versions due in the next batch
        run: node scripts/check-withdrawal-readiness.mjs
