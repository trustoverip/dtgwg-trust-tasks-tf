name: Dart

on:
  push:
    branches: [main]
  # No `branches:` filter, and no `paths:` filter, for the reasons spelled out at
  # length in ts.yml: a stacked PR would otherwise run none of these jobs and
  # report a green board made entirely of DCO and licence checks, and a
  # path-filtered job cannot be made a *required* check.
  #
  # These jobs are the guards that stop trust-tasks-dart disagreeing with the
  # other three bindings about the wire contract, so they are worth being able to
  # make required.
  pull_request:

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; a job that needs more asks for it by name.
permissions:
  contents: read

jobs:
  # pub.dev refuses an upload whose CHANGELOG.md exceeds 262144 bytes, and it
  # says so only at publish time, after the Release PR has merged. From 0.9.11
  # to 0.9.23 every trust_tasks publish failed that way, and the failed publish
  # held back the Release PR for every language. Fail here first, with room to
  # spare for the next Release PR's section.
  changelog-size:
    name: Dart CHANGELOG.md under pub.dev's limit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check sizes
        run: |
          limit=230000
          status=0
          for f in trust-tasks-dart*/CHANGELOG.md; do
            size=$(wc -c <"$f")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$f is $size bytes; pub.dev refuses more than 262144. Move the oldest entries to CHANGELOG-archive.md beside it (listed in that package's .pubignore), as trust-tasks-dart does."
              status=1
            fi
          done
          exit $status

  # The Dart mirror of codegen.yml's `codegen-drift` and the `bindings-drift`
  # jobs in ts.yml and go.yml: regenerate and fail if the committed output
  # differs. A spec change that regenerated only three of the four libraries is
  # exactly the defect this catches.
  #
  # The generator runs `dart format` on its own output (see the note at the end
  # of scripts/build-dart-bindings.mjs), so this compares like with like and a
  # contributor cannot introduce drift merely by not having the Dart SDK
  # installed.
  bindings-drift:
    name: build-dart-bindings drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate Dart bindings
        run: npm run build-dart-bindings
      - name: Check for drift
        run: |
          # `git status`, not `git diff`: a package the generator newly wrote is
          # untracked, and `git diff` cannot see an untracked file (codegen.yml).
          if [ -n "$(git status --porcelain -- trust-tasks-dart/lib/specs)" ]; then
            echo "::error::Dart bindings are stale. Run \`npm run build-dart-bindings\` and commit the diff, including any new files. Do NOT bump a version — the Release PR does that; see RELEASING.md."
            git status --short -- trust-tasks-dart/lib/specs
            git add -N -- trust-tasks-dart/lib/specs
            git diff -- trust-tasks-dart/lib/specs | head -200
            exit 1
          fi

  analyze:
    name: dart analyze + format (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 3.3 is the `sdk` floor in pubspec.yaml — the oldest a consumer may be
        # on, and the release that introduced the extension types the generated
        # closed-value types use. `stable` is what most will actually use.
        sdk: ["3.3", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        working-directory: trust-tasks-dart
        run: dart pub get
      # `--fatal-infos` because the generated tree is held to the same bar as the
      # hand-written runtime: a generator that emits code failing the project's
      # own lints is a generator to fix, not a tree to exempt.
      - name: Analyze
        working-directory: trust-tasks-dart
        run: dart analyze --fatal-infos
      # `--language-version` for the same reason the generator passes it:
      # `dart format` picks its style from the code's language version, and since
      # Dart 3.13 the newest version selects a different ("tall") style. Reading
      # the floor from the pubspec pins it, so this check cannot disagree with
      # the generator because of which SDK happened to run.
      #
      # Only on `stable`: two SDKs formatting the same language version should
      # agree, but the committed tree is produced by one of them, and asserting
      # that every SDK in the matrix reproduces it byte for byte is a promise
      # nobody made.
      - name: Check formatting
        if: matrix.sdk == 'stable'
        working-directory: trust-tasks-dart
        run: |
          floor=$(sed -n 's/^ *sdk: *^\{0,1\}\([0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml | head -1)
          echo "formatting at language version $floor"
          dart format --output=none --set-exit-if-changed --language-version="$floor" .

  # The generated libraries are only types and constants; the SPEC §7.2 consumer
  # pipeline in lib/src/runtime is hand-written, so unlike the rest of the
  # package it can regress without the drift guard noticing. These are its
  # conformance tests, and they mirror the sets in trust-tasks-rs/src/consume.rs,
  # trust-tasks-ts/test/ and trust-tasks-go/trusttasks — the four reference
  # implementations must reach the same verdict on the same document.
  #
  # test/smoke_test.dart is the counterpart of `npm run smoke` and
  # `go test ./smoke`: it imports a *generated* library and drives the real
  # pipeline with it, which is the one thing neither the drift check nor the
  # runtime tests do.
  test:
    name: dart test (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.3", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        working-directory: trust-tasks-dart
        run: dart pub get
      - name: Run the runtime conformance tests and the smoke test
        working-directory: trust-tasks-dart
        run: dart test

  # `dart run trust_tasks:generate` — the consumer-side generator, which reads a
  # trust-tasks.lock and its vendored bundles — run over EVERY bundle in the
  # registry and compared with the prebuilt tree under lib/specs/ (generated
  # from specs/ by scripts/build-dart-bindings.mjs). Two independent
  # generators from two inputs; this is what keeps them equivalent. The script
  # names the two differences the bundle format makes unavoidable (embedded
  # schema key order, compared as JSON; top-level declaration order, compared
  # declaration by declaration) and fails on anything else.
  consumer-generation:
    name: consumer generation matches the prebuilt tree
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build every bundle
        run: cargo run -q --release -p trust-tasks-codegen -- --bundles "$RUNNER_TEMP/bundles"
      - name: Install dependencies
        working-directory: trust-tasks-dart
        run: dart pub get
      - name: Compare
        run: node scripts/check-dart-consumer-generation.mjs "$RUNNER_TEMP/bundles"

  # An application that pins three tasks (the same three as
  # examples/consumer-app), generates their libraries, analyzes them with
  # --fatal-infos, and runs a round trip through the runtime. On the 3.3 floor
  # as well, where `dart format` has no --language-version.
  consumer-app:
    name: example application (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: ["3.3", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Install dependencies
        working-directory: examples/consumer-app-dart
        run: dart pub get
      - name: Generate
        working-directory: examples/consumer-app-dart
        run: dart run trust_tasks:generate --lock trust-tasks.lock --out lib/trust_tasks
      - name: Analyze
        working-directory: examples/consumer-app-dart
        run: dart analyze --fatal-infos
      - name: Run
        working-directory: examples/consumer-app-dart
        run: dart run bin/main.dart

  # The release is sized by the PR title: `feat(dart)!:` makes trust_tasks a
  # breaking release, anything else a patch. Nothing else stopped an accidental
  # break shipping as a patch — Rust has cargo-semver-checks, Dart had nothing.
  # This compares the PR's public API — the runtime AND every generated library
  # under lib/specs — with the latest trust_tasks on pub.dev, and fails on a
  # break the title does not declare. Additions (a new spec version, a new
  # optional member, a new closed value) pass. See scripts/check-dart-api.mjs
  # for what counts as breaking and the two rewrites dart_apitool needs.
  #
  # The title is read from the API at run time, not from the event payload: the
  # workflow does not run on `edited` (that would re-run every job here on any
  # description edit), so after retitling a PR to `feat(dart)!:` you re-run this
  # job, and a re-run replays the ORIGINAL event, title included.
  api-compatibility:
    name: Dart API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and tags: a break already declared since the published
          # release (trust-tasks-dart-v*) lets this PR's break through.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      # Pinned with the tool: dart_apitool 0.23.2 analyses with analyzer 10.2,
      # and an analyzer older than the SDK it runs on is not guaranteed to read
      # that SDK's libraries. Move the two together.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13"
      - run: npm ci --no-audit --no-fund
      - name: Activate dart_apitool
        run: dart pub global activate dart_apitool 0.23.2
      - name: Compare with the published trust_tasks
        # Passed through the environment, never interpolated into the script
        # (see commit-lint.yml).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title) || PR_TITLE=$EVENT_TITLE
          export PR_TITLE
          node scripts/check-dart-api.mjs

  # Five hand-maintained files each list the Dart packages (see the script's
  # header). #483 left the tag-dart matrix with an entry that had no `dir`; the
  # YAML was valid, so only a failed release showed it.
  package-lists:
    name: Dart package lists agree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run check-dart-packages
      # The same guard for the npm, Go and crate release lists, and for
      # commit-lint's `!` scope vocabulary against the scopes the release
      # scripts read (#1139, #1137). Here rather than in a job of its own so the
      # check names stay as they are.
      - run: npm run check-release-lists

  # The hand-written packages built on trust_tasks: the Data Integrity proofs
  # and the HTTPS, DIDComm and TSP bindings.
  #
  # trust_tasks_tsp is tested here but is NOT in the release matrices in
  # publish.yml: it depends on affinidi_tsp, which is not on pub.dev yet, so it
  # cannot be published (its pubspec_overrides.yaml supplies affinidi_tsp from
  # git). CI resolves that override; a release, which deletes it, cannot. When
  # affinidi_tsp publishes, a follow-up flips the dep to hosted and adds the
  # release entries. `check-dart-packages` allows a package tested here that is
  # not (yet) in the release matrices. Each is held to the same bar as the core — analysis with
  # --fatal-infos, formatting at its own SDK floor, and its tests on that floor
  # and on stable.
  #
  # They resolve `trust_tasks` from the tree (pubspec_overrides.yaml), so a PR
  # that changes the core and its consumer together is tested together. Whether
  # a package's newest release works against the *published* core is a release
  # question, asked by `tag-dart` in publish.yml.
  #
  # The `downgrade` legs ask the other half: does lib/ (and example/) still
  # compile against the OLDEST core — and oldest everything else — its pubspec
  # admits? `check-sibling-core-ranges` only checks that a range admits the
  # newest core, and every sibling once declared `^0.9.3` while importing
  # libraries that first shipped in 0.9.23 (#1115): a consumer on an older core
  # got a compile error instead of a resolver error. These legs drop the
  # in-tree override for trust_tasks, `dart pub downgrade`, and analyze. When a
  # sibling needs newer published core API, raise its floor in the same PR.
  # When it needs core API no published core has yet (a PR adding core API and
  # its first use together), the leg warns — except in the Release PR, where
  # the floor must name the core being released — and a floor naming an
  # unpublished core (a Release PR crossing a minor) is skipped until it is.
  packages:
    name: ${{ matrix.package }} (${{ matrix.sdk }}${{ matrix.ssi && format(', ssi {0}', matrix.ssi) || '' }}${{ matrix.downgrade && ', downgrade' || '' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.6 is the floor ssi 3.9 sets; see the pubspec.
          - package: trust-tasks-dart-proof
            sdk: "3.6"
          - package: trust-tasks-dart-proof
            sdk: stable
          # The pubspec accepts ssi 3.9.6 up to, not including, 5 — deliberately,
          # so it can share a graph with package:didcomm, which pins ssi 3. pub
          # picks 4.x above, so pin the other major here or it is never tested.
          - package: trust-tasks-dart-proof
            sdk: stable
            ssi: "3.9.6"
          # 3.3 is the floor it shares with trust_tasks.
          - package: trust-tasks-dart-https
            sdk: "3.3"
          - package: trust-tasks-dart-https
            sdk: stable
          # 3.6 is the floor package:didcomm sets.
          - package: trust-tasks-dart-didcomm
            sdk: "3.6"
          - package: trust-tasks-dart-didcomm
            sdk: stable
          # affinidi_tsp's floor is 3.8. Resolves affinidi_tsp from git via the
          # package's committed pubspec_overrides.yaml.
          - package: trust-tasks-dart-tsp
            sdk: "3.8"
          - package: trust-tasks-dart-tsp
            sdk: stable
          # Pure wire logic, no crypto or transport dep. 3.6 is its floor — the
          # minimum `lints` 5.1 (its only dev dependency) allows, same as
          # trust-tasks-dart-proof. Released like the other siblings (tag-dart
          # in publish.yml, DART_PACKAGES in scripts/release-pr.sh).
          - package: trust-tasks-dart-capability-client
            sdk: "3.6"
          - package: trust-tasks-dart-capability-client
            sdk: stable
          # The floors: every dependency at the lowest version the pubspec
          # admits, trust_tasks from pub.dev rather than the tree.
          - package: trust-tasks-dart-proof
            sdk: stable
            downgrade: true
          - package: trust-tasks-dart-https
            sdk: stable
            downgrade: true
          - package: trust-tasks-dart-didcomm
            sdk: stable
            downgrade: true
          - package: trust-tasks-dart-tsp
            sdk: stable
            downgrade: true
          - package: trust-tasks-dart-capability-client
            sdk: stable
            downgrade: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A PR touching none of this package's inputs skips the steps below and
      # the job still reports success (it may be a required check, so the job
      # itself always runs). The inputs: the package, the core it resolves
      # from the tree (and whose floor the downgrade leg reads from its
      # pubspec), the shared fixtures, and this workflow. Push, dispatch and
      # the Release PR always run in full; see .github/actions/changed-paths
      # (#1141). A downgrade leg skipped here is next run on `main`, where a
      # newly published core is picked up.
      - name: Did this PR change this job's inputs?
        id: changes
        uses: ./.github/actions/changed-paths
        with:
          paths: |
            ${{ matrix.package }}
            trust-tasks-dart
            fixtures
            .github/workflows/dart.yml
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.changes.outputs.run == 'true'
        with:
          sdk: ${{ matrix.sdk }}
      - name: Pin ssi
        if: steps.changes.outputs.run == 'true' && (matrix.ssi)
        working-directory: ${{ matrix.package }}
        run: |
          printf '  ssi: %s\n' "${{ matrix.ssi }}" >> pubspec_overrides.yaml
      # Drop the trust_tasks override (only that one: trust-tasks-dart-tsp's
      # also supplies affinidi_tsp from git), as tag-dart does before verifying
      # a release, so the floor is resolved from pub.dev.
      - name: Use the published core
        id: floor
        if: steps.changes.outputs.run == 'true' && (matrix.downgrade)
        working-directory: ${{ matrix.package }}
        run: |
          floor=$(sed -n 's/^  trust_tasks: *\^\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(curl -fsS https://pub.dev/api/packages/trust_tasks | jq -r .latest.version)
          echo "trust_tasks floor $floor; newest on pub.dev $latest"
          if [ "$(printf '%s\n%s\n' "$floor" "$latest" | sort -V | head -1)" != "$floor" ]; then
            echo "::warning file=${{ matrix.package }}/pubspec.yaml::trust_tasks ^$floor is not on pub.dev yet (newest: $latest); the floor is tested once it is."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i '/^  trust_tasks:$/,/^    path: /d' pubspec_overrides.yaml
          grep -qE '^  [a-z_]+:' pubspec_overrides.yaml || rm pubspec_overrides.yaml
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true' && (steps.floor.outputs.skip != 'true')
        working-directory: ${{ matrix.package }}
        run: |
          if [ "${{ matrix.downgrade }}" = true ]; then dart pub downgrade; else dart pub get; fi
          dart pub deps --style=compact | grep -E '^- (ssi|trust_tasks) '
      - name: Analyze
        if: steps.changes.outputs.run == 'true' && (!matrix.downgrade)
        working-directory: ${{ matrix.package }}
        run: dart analyze --fatal-infos
      # lib/ is what a consumer compiles and example/ is what pub.dev shows;
      # test/ may exercise in-tree core the floor predates.
      - name: Analyze at the floors
        if: steps.changes.outputs.run == 'true' && (matrix.downgrade && steps.floor.outputs.skip != 'true')
        working-directory: ${{ matrix.package }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -- lib
          if [ -d example ]; then set -- lib example; fi
          dart analyze --fatal-infos "$@" && exit 0
          # Failing at the floor means one of two things. If the newest core
          # on pub.dev passes, the floor is too low: raise it. If that fails
          # too, lib/ uses core API no published core has yet — normal between
          # a core change and its release. The Release PR is where the floor
          # must move to the core it publishes, so fail there; warn elsewhere.
          dart pub upgrade >/dev/null
          if dart analyze --fatal-infos "$@" >/dev/null 2>&1; then
            echo "::error file=${{ matrix.package }}/pubspec.yaml::lib/ does not compile against its trust_tasks floor but does against the newest published core: raise the floor."
            exit 1
          fi
          if [ "$HEAD_REF" = release ]; then
            echo "::error file=${{ matrix.package }}/pubspec.yaml::lib/ needs core API no published trust_tasks has: in the Release PR the floor must name the core this release publishes."
            exit 1
          fi
          echo "::warning file=${{ matrix.package }}/pubspec.yaml::lib/ needs core API no published trust_tasks has yet; the floor is tested once that core is released."
      - name: Check formatting
        if: steps.changes.outputs.run == 'true' && (matrix.sdk == 'stable' && !matrix.ssi && !matrix.downgrade)
        working-directory: ${{ matrix.package }}
        run: |
          floor=$(sed -n 's/^ *sdk: *^\{0,1\}\([0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml | head -1)
          echo "formatting at language version $floor"
          dart format --output=none --set-exit-if-changed --language-version="$floor" .
      - name: Test
        if: steps.changes.outputs.run == 'true' && (!matrix.downgrade)
        working-directory: ${{ matrix.package }}
        run: dart test
