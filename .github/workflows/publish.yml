name: Release

# THE FILENAME OF THIS FILE IS LOAD-BEARING. Do not rename it.
#
# crates.io Trusted Publishing is configured per crate against a specific
# repository + workflow FILENAME, and all nine published crates here are
# registered against `publish.yml`. Renaming this file to `release-plz.yml`
# in a sibling repo made the OIDC exchange fail before any release logic ran:
#
#   Failed to retrieve token from Cargo registry. Status: 400.
#   The Trusted Publishing config ... does not match the workflow filename
#   `release-plz.yml` in the JWT. Expected workflow filenames: `publish.yml`
#
# To rename it you must first update the Trusted Publisher config of every
# published crate on crates.io. Not worth it — the name is ours to choose, the
# registry's expectation is not. The npm Trusted Publisher for
# `@openvtc/trust-tasks` is pinned to this filename too.
#
# ── What changed, and why ────────────────────────────────────────────────────
#
# This file used to publish on every push to `main` whatever version was newer
# than the registry. Combined with the CI gates that REQUIRED a version bump on
# every changed publishable crate, that made a version bump the release trigger
# and therefore made every feature PR a release decision, taken before it
# merged. Seven releases went out in a single day as a direct consequence.
#
# Now: merge PRs to `main` freely. `release-plz-pr` keeps ONE Release PR up to
# date with the version bumps and changelog entries those merges imply, and
# `release-ts-pr` does the same for the npm package. Merging a Release PR is
# the release — `release-plz-release` tags and publishes the crates, and
# `publish-npm` publishes the package. An ordinary feature merge runs every job
# here and all of them are no-ops. See RELEASING.md.
#
# WHICH crates publish is decided in the manifests (`publish = false` on
# `trust-tasks-codegen`), not here.

on:
  push:
    branches: [main]
  # Manual escape hatch: re-run a release after fixing something, without
  # needing a fresh commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust ─────────────────────────────────────────────────────────────────
  release-plz-release:
    # Runs on every push to main, but only *does* anything when a crate's
    # version is not yet on crates.io — which in practice means immediately
    # after the Release PR merges. An ordinary feature merge is a no-op.
    name: Release-plz release (crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      # OIDC token exchange with crates.io. Trusted Publishing means no
      # long-lived registry token is stored in this repo; crates.io mints a
      # short-lived one per run after verifying the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags. release-plz decides WHETHER a crate changed by
          # comparing its packaged files against the tarball on crates.io — it
          # downloads each published crate to do so — but it decides WHAT the
          # changelog says from the commits since that crate's `<crate>-v*` tag.
          # Shallow history therefore produces a correct bump with an empty
          # changelog, which is the failure mode to recognise.
          fetch-depth: 0
          persist-credentials: false

      # The binding crates pull in Affinidi's TDK (keyring / secret-storage),
      # whose build scripts probe for libdbus-1 via pkg-config. `cargo publish`
      # compiles the packaged tarball, so the release job needs them too — same
      # as the `test` / `package` jobs in rust.yml.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Run release-plz
        # Pinned to a full version: release-plz/action does NOT publish a
        # moving major tag, so `@v0` resolves to nothing and the job fails at
        # "Set up job" before running a step. (actions/checkout@v6 works
        # because that repo does publish v6 — the convention is not universal.)
        uses: release-plz/action@v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release-plz-pr:
    name: Release-plz PR (crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Deliberately only on this job. Serialising the release job could skip a
      # release; serialising PR updates just coalesces them.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      # release-plz compares each crate's public API against its published
      # version and forces a compatibility-breaking bump when it actually
      # broke. Without this binary present release-plz logs "cargo-semver-checks
      # not installed, skipping semver check" and silently falls back to
      # guessing from commit messages — which is the failure this exists to
      # prevent, and it is only a warning, so nothing goes red.
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@cargo-semver-checks

      # DCO requires a `Signed-off-by` trailer on every commit, and the
      # release commit is no exception — the Release PR is the one commit that
      # publishes, so it is the last place to be sloppy about provenance.
      # `format.signOff` covers release-plz if it shells out to `git commit`;
      # the verification step below covers it if it does not. Belt and braces
      # because the failure is silent — a Release PR that simply sits red.
      - name: Sign off release commits by default
        run: git config --global format.signOff true

      - name: Run release-plz
        id: release_pr
        uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          # A PAT or GitHub App token, falling back to the default token.
          #
          # THE FALLBACK SHIPS A RELEASE NOBODY TESTED. GitHub suppresses
          # workflow runs for events authored by GITHUB_TOKEN, so with the
          # default token the Release PR opens with no CI on it — meaning the
          # one commit that publishes to crates.io would be the one commit CI
          # never built.
          #
          # Set RELEASE_PLZ_TOKEN to a PAT (contents + pull-requests write) or
          # a GitHub App token. Until then, close-and-reopen the Release PR to
          # trigger CI before merging it. See RELEASING.md.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # `format.signOff` only reaches release-plz if it commits through the git
      # CLI. It may not, so verify rather than assume: if the branch tip has no
      # trailer, add one and force-push. Amending is safe here — the branch is
      # release-plz's own, it force-pushes over it on every run, and nobody
      # branches from it.
      - name: Ensure the release commit is signed off
        if: steps.release_pr.outputs.prs_created == 'true'
        env:
          # The action exposes `pr` (JSON of the opened PR), not a bare branch
          # name — verified against action.yml, whose outputs are exactly
          # pr / prs / prs_created / releases / releases_created.
          PR_JSON: ${{ steps.release_pr.outputs.pr }}
        run: |
          BRANCH=$(jq -r '.head_branch // empty' <<<"$PR_JSON")
          if [ -z "$BRANCH" ]; then
            echo "::error::release-plz reported a PR but no head_branch: $PR_JSON"
            exit 1
          fi
          git fetch origin "$BRANCH" --depth=1
          if git log -1 --format='%(trailers:key=Signed-off-by)' "origin/$BRANCH" | grep -q .; then
            echo "::notice::$BRANCH is already signed off"
            exit 0
          fi
          author_name=$(git log -1 --format='%an' "origin/$BRANCH")
          author_email=$(git log -1 --format='%ae' "origin/$BRANCH")
          echo "::warning::$BRANCH was not signed off; amending as $author_name <$author_email>"
          git checkout -q -B "$BRANCH" "origin/$BRANCH"
          # Preserve the original author; the trailer names them, because they
          # are who the DCO is a statement by.
          git -c user.name="$author_name" -c user.email="$author_email" \
              commit --amend --no-edit -s
          git push --force-with-lease origin "$BRANCH"

  # ── npm ──────────────────────────────────────────────────────────────────
  #
  # release-plz is Rust-only: it has no hooks and cannot touch a non-Rust
  # manifest, so `@openvtc/trust-tasks` cannot ride in the crates Release PR.
  # It gets its own Release PR instead, computed the same way (conventional
  # commits since the package's last release tag) and merged the same way.
  # See scripts/release-ts-pr.sh and RELEASING.md.
  publish-npm:
    name: Publish @openvtc/trust-tasks to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # `contents: write` so the tag can be pushed after a successful publish —
      # `trust-tasks-ts-v<version>` is what the next Release PR measures from,
      # the npm mirror of the `<crate>-v<version>` tags release-plz writes.
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    outputs:
      published: ${{ steps.decide.outputs.should_publish }}
    concurrency:
      # Two pushes landing close together would both see the version as absent
      # from npm and both try to publish it; the loser fails on a duplicate.
      group: publish-npm-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # npm@latest (v12+, installed below for OIDC trusted publishing)
          # requires Node >= 22.22.2; Node 20 fails with EBADENGINE.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Decide whether to publish
        id: decide
        working-directory: trust-tasks-ts
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps & build
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: trust-tasks-ts
        run: |
          npm ci
          npm run build

      # No NODE_AUTH_TOKEN: with trusted publishing npm mints a short-lived
      # token via OIDC and attaches build provenance automatically.
      - name: npm publish (trusted publishing)
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: trust-tasks-ts
        run: npm publish --access public

      # The tag is the anchor for the NEXT Release PR: release-ts-pr reads
      # commits since `trust-tasks-ts-v<version>` to decide the bump and to
      # generate the changelog section. Without it the package would be
      # measured from nothing and every run would propose the whole history.
      - name: Tag the npm release
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          tag="trust-tasks-ts-v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "@openvtc/trust-tasks $VERSION"
          git push origin "$tag"

  release-ts-pr:
    name: Release PR (@openvtc/trust-tasks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # MUST run after publish-npm, not beside it. Both jobs fire on the same
    # push, and the tag that this job measures from is written by publish-npm.
    # Running them in parallel means the run that merges a TS release computes
    # its next bump against the PREVIOUS tag and immediately reopens a Release
    # PR for a release that just went out.
    needs: publish-npm
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-ts-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Same token `gh` uses below, so the branch push and the PR come from
          # one identity. With a PAT in RELEASE_PLZ_TOKEN that also means CI
          # actually runs on the Release PR — GitHub suppresses workflow runs
          # for events authored by the default GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Generates the changelog section for the package from the same
      # cliff.toml release-plz uses for the crates, so both sides of the
      # release read identically.
      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Open or update the @openvtc/trust-tasks Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/release-ts-pr.sh
