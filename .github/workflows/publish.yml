name: Release

# THE FILENAME OF THIS FILE IS LOAD-BEARING. Do not rename it.
#
# crates.io Trusted Publishing is configured per crate against a specific
# repository + workflow FILENAME, and all nine published crates here are
# registered against `publish.yml`. Renaming this file to `release-plz.yml`
# in a sibling repo made the OIDC exchange fail before any release logic ran:
#
#   Failed to retrieve token from Cargo registry. Status: 400.
#   The Trusted Publishing config ... does not match the workflow filename
#   `release-plz.yml` in the JWT. Expected workflow filenames: `publish.yml`
#
# To rename it you must first update the Trusted Publisher config of every
# published crate on crates.io. Not worth it — the name is ours to choose, the
# registry's expectation is not. The npm Trusted Publisher for
# `@openvtc/trust-tasks` is pinned to this filename too.
#
# ── What changed, and why ────────────────────────────────────────────────────
#
# This file used to publish on every push to `main` whatever version was newer
# than the registry. Combined with the CI gates that REQUIRED a version bump on
# every changed publishable crate, that made a version bump the release trigger
# and therefore made every feature PR a release decision, taken before it
# merged. Seven releases went out in a single day as a direct consequence.
#
# Now: merge PRs to `main` freely. `release-pr` (the last job here) keeps ONE
# Release PR up to date with the version bumps and changelog entries those
# merges imply, for every package in every language. Merging it is the release
# — `release-plz-release`, `publish-npm`, `publish-go` and `tag-dart` each
# publish whatever version is not out yet. An ordinary feature merge runs every
# publish job here and all of them are no-ops. See RELEASING.md.
#
# WHICH crates publish is decided in the manifests (`publish = false` on
# `trust-tasks-codegen`), not here.

on:
  push:
    branches: [main]
  # Manual escape hatch: re-run a release after fixing something, without
  # needing a fresh commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust ─────────────────────────────────────────────────────────────────
  release-plz-release:
    # Runs on every push to main, but only *does* anything when a crate's
    # version is not yet on crates.io — which in practice means immediately
    # after the Release PR merges. An ordinary feature merge is a no-op.
    name: Release-plz release (crates.io)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      # OIDC token exchange with crates.io. Trusted Publishing means no
      # long-lived registry token is stored in this repo; crates.io mints a
      # short-lived one per run after verifying the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags. release-plz decides WHETHER a crate changed by
          # comparing its packaged files against the tarball on crates.io — it
          # downloads each published crate to do so — but it decides WHAT the
          # changelog says from the commits since that crate's `<crate>-v*` tag.
          # Shallow history therefore produces a correct bump with an empty
          # changelog, which is the failure mode to recognise.
          fetch-depth: 0
          persist-credentials: false

      # The binding crates pull in Affinidi's TDK (keyring / secret-storage),
      # whose build scripts probe for libdbus-1 via pkg-config. `cargo publish`
      # compiles the packaged tarball, so the release job needs them too — same
      # as the `test` / `package` jobs in rust.yml.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Run release-plz
        # Pinned to a full version: release-plz/action does NOT publish a
        # moving major tag, so `@v0` resolves to nothing and the job fails at
        # "Set up job" before running a step. (actions/checkout@v6 works
        # because that repo does publish v6 — the convention is not universal.)
        uses: release-plz/action@v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── npm ──────────────────────────────────────────────────────────────────
  #
  # release-plz is Rust-only: it cannot touch a non-Rust manifest, so each
  # package's bump is computed by scripts/release-bump-ts.sh (conventional
  # commits since the package's last release tag) and rides in the same
  # Release PR as the crates. See RELEASING.md.
  # One matrix entry per npm package. The core is @openvtc/trust-tasks; the
  # sibling packages (-proof, -tsp) publish from their own directories under
  # their own tag prefix. Each is skipped when its version is already on npm, so
  # a feature merge is a no-op and the first publish of a new package (which npm
  # trusted publishing cannot bootstrap) is done by hand — see RELEASING.md.
  publish-npm:
    name: Publish ${{ matrix.name }} to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # `contents: write` so the tag can be pushed after a successful publish —
      # `<prefix>-v<version>` is what the next Release PR measures from, the npm
      # mirror of the `<crate>-v<version>` tags release-plz writes.
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@openvtc/trust-tasks"
            dir: trust-tasks-ts
            prefix: trust-tasks-ts-v
          - name: "@openvtc/trust-tasks-proof"
            dir: trust-tasks-ts-proof
            prefix: trust-tasks-ts-proof-v
          - name: "@openvtc/trust-tasks-tsp"
            dir: trust-tasks-ts-tsp
            prefix: trust-tasks-ts-tsp-v
          - name: "@openvtc/trust-tasks-capability-client"
            dir: trust-tasks-ts-capability-client
            prefix: trust-tasks-ts-capability-client-v
    concurrency:
      # Two pushes landing close together would both see the version as absent
      # from npm and both try to publish it; the loser fails on a duplicate.
      group: publish-npm-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # npm@latest (v12+, installed below for OIDC trusted publishing)
          # requires Node >= 22.22.2; Node 20 fails with EBADENGINE.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Decide whether to publish
        id: decide
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps & build
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          npm ci
          npm run build

      # No NODE_AUTH_TOKEN: with trusted publishing npm mints a short-lived
      # token via OIDC and attaches build provenance automatically.
      - name: npm publish (trusted publishing)
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public

      # The tag is the anchor for the NEXT Release PR: release-bump-ts.sh reads
      # commits since `trust-tasks-ts-v<version>` to decide the bump and to
      # generate the changelog section. Without it the package would be
      # measured from nothing and every run would propose the whole history.
      - name: Tag the npm release
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          PREFIX: ${{ matrix.prefix }}
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          tag="${PREFIX}$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          git push origin "$tag"

  # ── Go ───────────────────────────────────────────────────────────────────
  #
  # The third registry, and the only one with no registry at all: a Go module is
  # published by pushing a tag to a public repository, after which
  # proxy.golang.org fetches and serves it. There is no account, no token and no
  # OIDC exchange — which also means nothing here can be "configured wrong" in
  # the way the crates.io and npm Trusted Publishers can.
  #
  # The tag MUST be `trust-tasks-go/vX.Y.Z`. For a module in a subdirectory the
  # go tooling derives the tag prefix from the subdirectory, so this spelling is
  # a requirement rather than a convention — unlike the `trust-tasks-ts-v*` and
  # `<crate>-v*` tags elsewhere in this file, which are ours to choose.
  # One matrix entry per Go module: the core, and the two nested modules that
  # version independently on their own `trust-tasks-go/<name>/vX.Y.Z` tags
  # (proof and didcomm). tsp is deliberately absent — it depends on the
  # unpublished affinidi-tsp-go and so cannot be released. Each leg reads its own
  # `const Version`, and the nested legs' verify step fetches the published core.
  publish-go:
    name: Publish ${{ matrix.name }} (tag + module proxy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The tag IS the publication, so this is the one permission that matters.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trust-tasks-go
            dir: trust-tasks-go
            versionfile: trust-tasks-go/trusttasks/version.go
            tagprefix: trust-tasks-go/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go
          - name: trust-tasks-go/proof
            dir: trust-tasks-go/proof
            versionfile: trust-tasks-go/proof/version.go
            tagprefix: trust-tasks-go/proof/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go/proof
          - name: trust-tasks-go/didcomm
            dir: trust-tasks-go/didcomm
            versionfile: trust-tasks-go/didcomm/version.go
            tagprefix: trust-tasks-go/didcomm/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go/didcomm
    concurrency:
      group: publish-go-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: decide
        env:
          VERSION_FILE: ${{ matrix.versionfile }}
          TAG_PREFIX: ${{ matrix.tagprefix }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' "$VERSION_FILE")
          if [ -z "$version" ]; then
            echo "::error::Could not read \`const Version\` from $VERSION_FILE"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG_PREFIX}${version}" >/dev/null; then
            echo "::notice::${TAG_PREFIX}${version} already tagged — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${TAG_PREFIX}${version} is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v6
        if: steps.decide.outputs.should_publish == 'true'
        with:
          go-version: "1.24"
          cache: false

      # Publishing is irreversible in a way npm and crates.io are not: the module
      # proxy caches a tag permanently and by design, so a tag pushed over a tree
      # that does not build is served to every consumer forever and cannot be
      # retracted, only superseded. Build and test before tagging, not after.
      - name: Verify the module before tagging
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - name: Tag the release
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          NAME: ${{ matrix.name }}
          TAG_PREFIX: ${{ matrix.tagprefix }}
        run: |
          set -euo pipefail
          tag="${TAG_PREFIX}${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          git push origin "$tag"

      # Ask the module proxy for the version so it fetches and caches it now.
      # Without this the first consumer to run `go get` pays the fetch, and a
      # failure there surfaces to them rather than here.
      - name: Warm proxy.golang.org
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          MODULE: ${{ matrix.module }}
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail
          # The proxy polls for new tags; it can take a minute to see one.
          for attempt in 1 2 3 4 5 6; do
            if go list -m "$MODULE@v$VERSION" 2>/dev/null; then
              echo "::notice::proxy.golang.org is serving $MODULE@v$VERSION"
              exit 0
            fi
            echo "attempt $attempt: not yet indexed, waiting 20s"
            sleep 20
          done
          # Not a failure: the tag is pushed, which IS the publication, and the
          # proxy will index it on its own schedule.
          echo "::warning::proxy.golang.org has not indexed $MODULE@v$VERSION yet. The tag is pushed; the proxy will pick it up. Verify with: go list -m $MODULE@v$VERSION"

  # ── Dart ─────────────────────────────────────────────────────────────────
  #
  # The odd one out: pub.dev only accepts an automated publish when the workflow
  # run was triggered by a TAG push, which it checks in the OIDC token's claims.
  # So this job does not publish — it only writes the tag, and
  # `publish-dart.yml` (triggered by that tag) does the publishing.
  #
  # One matrix entry per Dart package. `max-parallel: 1` and the core first:
  # a package built on `trust_tasks` is verified against the *published* core
  # (below), so the core's tag has to have gone out before its consumers are
  # judged. Adding a package: an entry here, one in DART_PACKAGES and a case
  # arm in scripts/release-bump-dart.sh (both read by release-pr.sh), and the
  # tag pattern and `case` arm in publish-dart.yml.
  #
  # One Release PR can bump the core and a dependent together. If the dependent
  # needs core API that was unreleased until this merge, its leg below can run
  # before pub.dev has finished publishing the core and fail; re-run the job
  # once the core is live. Its failure also holds back `release-pr` until then.
  tag-dart:
    name: Tag ${{ matrix.name }} for pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - name: trust_tasks
            dir: trust-tasks-dart
            prefix: trust-tasks-dart-v
          - name: trust_tasks_proof
            dir: trust-tasks-dart-proof
            prefix: trust-tasks-dart-proof-v
          - name: trust_tasks_https
            dir: trust-tasks-dart-https
            prefix: trust-tasks-dart-https-v
          - name: trust_tasks_didcomm
            dir: trust-tasks-dart-didcomm
            prefix: trust-tasks-dart-didcomm-v
          - name: trust_tasks_capability_client
            dir: trust-tasks-dart-capability-client
            prefix: trust-tasks-dart-capability-client-v
    concurrency:
      group: tag-dart-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # A tag pushed by the default GITHUB_TOKEN does not trigger
          # `publish-dart.yml`, so prefer the PAT when there is one. The step
          # below says so out loud when there is not.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Decide whether to tag
        id: decide
        env:
          DIR: ${{ matrix.dir }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' "$DIR/pubspec.yaml" | head -1 | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::Could not read \`version\` from $DIR/pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$PREFIX$version" >/dev/null; then
            echo "::notice::$PREFIX$version already tagged — skipping."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$PREFIX$version is new — tagging."
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@v1
        if: steps.decide.outputs.should_tag == 'true'
        with:
          sdk: stable

      # Verify before tagging, not after: the tag is what pub.dev publishes from,
      # and a published version cannot be replaced — only superseded.
      #
      # pubspec_overrides.yaml is removed first. In CI it points a package at
      # the in-tree `trust_tasks`; a consumer gets the published one, so that is
      # what a release must pass against. A package that needs core API nobody
      # has released yet fails here, and the fix is to release the core first.
      #
      # `git rm`, not `rm`: a tracked file missing from the working tree makes
      # `dart pub publish --dry-run` warn that a checked-in file is ignored, and
      # exit 65. Removing it from the index as well keeps the dry run clean.
      - name: Verify the package before tagging
        if: steps.decide.outputs.should_tag == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          git rm -q --ignore-unmatch pubspec_overrides.yaml
          dart pub get
          dart analyze --fatal-infos
          dart test
          # The same dry run publish-dart.yml performs, surfaced here where a
          # failure costs a re-run rather than a burnt version number.
          dart pub publish --dry-run

      - name: Tag the release
        if: steps.decide.outputs.should_tag == 'true'
        env:
          NAME: ${{ matrix.name }}
          PREFIX: ${{ matrix.prefix }}
          VERSION: ${{ steps.decide.outputs.version }}
          HAVE_PAT: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
        run: |
          set -euo pipefail
          tag="$PREFIX$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          git push origin "$tag"
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::$tag was pushed with the default GITHUB_TOKEN, so publish-dart.yml will NOT have been triggered and $VERSION is NOT on pub.dev. Delete and re-push the tag from a workstation to publish it: git push --delete origin $tag && git push origin $tag"
          fi

  # ── The Release PR ───────────────────────────────────────────────────────
  #
  # ONE PR for every package, opened and refreshed by scripts/release-pr.sh:
  # `release-plz update` for the crates, then scripts/release-bump-*.sh for
  # each npm package, Go module and Dart package, committed together. This
  # replaced thirteen per-package Release PRs, each of which was regenerated —
  # and its CI restarted — every time another one merged.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # MUST run after every publish job. Each bump is measured from the tag (or,
    # for the crates, the registry version) that those jobs write, so running
    # beside them means the push that merges a release computes the next one
    # against the PREVIOUS release and immediately reopens a PR for what just
    # went out. (A matrix `needs` waits for every leg.)
    needs: [release-plz-release, publish-npm, publish-go, tag-dart]
    # Not after a failed publish: the half-published state is for a human to
    # finish (re-run the failed job), and proposing the next release on top of
    # it would only muddy which versions are actually out. Skipped legs are
    # fine — that is an ordinary feature merge.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # Serialising PR updates just coalesces them; the branch is derived, so
      # the last run to finish writes the right tree.
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags: every bump is measured from a tag, and a
          # shallow clone produces a correct bump with an empty changelog.
          fetch-depth: 0
          # Same token `gh` uses below, so the branch push and the PR come from
          # one identity. With a PAT in RELEASE_PLZ_TOKEN that also means CI
          # actually runs on the Release PR — GitHub suppresses workflow runs
          # for events authored by the default GITHUB_TOKEN, and the one commit
          # that publishes must not be the one commit CI never built.
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      # cargo-semver-checks builds rustdoc for the binding crates, whose TDK
      # dependencies probe for libdbus-1 via pkg-config.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. The
          # *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # cargo-semver-checks MUST be present: without it release-plz logs
      # "cargo-semver-checks not installed, skipping semver check" and silently
      # falls back to guessing from commit messages — only a warning, so nothing
      # goes red. git-cliff is for the non-Rust changelogs, from the same
      # cliff.toml release-plz reads, so every part of a release reads alike.
      - name: Install release-plz, cargo-semver-checks and git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz,cargo-semver-checks,git-cliff

      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/release-pr.sh
