name: Release

# THE FILENAME OF THIS FILE IS LOAD-BEARING. Do not rename it.
#
# crates.io Trusted Publishing is configured per crate against a specific
# repository + workflow FILENAME, and all nine published crates here are
# registered against `publish.yml`. Renaming this file to `release-plz.yml`
# in a sibling repo made the OIDC exchange fail before any release logic ran:
#
#   Failed to retrieve token from Cargo registry. Status: 400.
#   The Trusted Publishing config ... does not match the workflow filename
#   `release-plz.yml` in the JWT. Expected workflow filenames: `publish.yml`
#
# To rename it you must first update the Trusted Publisher config of every
# published crate on crates.io. Not worth it — the name is ours to choose, the
# registry's expectation is not. The npm Trusted Publisher for
# `@openvtc/trust-tasks` is pinned to this filename too.
#
# ── What changed, and why ────────────────────────────────────────────────────
#
# This file used to publish on every push to `main` whatever version was newer
# than the registry. Combined with the CI gates that REQUIRED a version bump on
# every changed publishable crate, that made a version bump the release trigger
# and therefore made every feature PR a release decision, taken before it
# merged. Seven releases went out in a single day as a direct consequence.
#
# Now: merge PRs to `main` freely. `release-pr` (the last job here) keeps ONE
# Release PR up to date with the version bumps and changelog entries those
# merges imply, for every package in every language. Merging it is the release
# — `release-plz-release`, `publish-npm`, `publish-go` and `tag-dart` each
# publish whatever version is not out yet. An ordinary feature merge runs every
# publish job here and all of them are no-ops. See RELEASING.md.
#
# WHICH crates publish is decided in the manifests (`publish = false` on
# `trust-tasks-codegen`), not here.

on:
  push:
    branches: [main]
  # Manual escape hatch: re-run a release after fixing something, without
  # needing a fresh commit. Only a run on main publishes; dispatched on any
  # other branch, every job is skipped.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Rust ─────────────────────────────────────────────────────────────────
  release-plz-release:
    # Publishes only from main, including a manual re-run.
    if: github.ref == 'refs/heads/main'
    # Runs on every push to main, but only *does* anything when a crate's
    # version is not yet on crates.io — which in practice means immediately
    # after the Release PR merges. An ordinary feature merge is a no-op.
    name: Release-plz release (crates.io)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      # OIDC token exchange with crates.io. Trusted Publishing means no
      # long-lived registry token is stored in this repo; crates.io mints a
      # short-lived one per run after verifying the workflow's identity.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags. release-plz decides WHETHER a crate changed by
          # comparing its packaged files against the tarball on crates.io — it
          # downloads each published crate to do so — but it decides WHAT the
          # changelog says from the commits since that crate's `<crate>-v*` tag.
          # Shallow history therefore produces a correct bump with an empty
          # changelog, which is the failure mode to recognise.
          fetch-depth: 0
          persist-credentials: false

      # Kept from when this job compiled what it published, for the TDK
      # dependencies' build scripts, which probe for libdbus-1 via pkg-config.
      # It no longer compiles anything (`publish_no_verify = true` in
      # release-plz.toml), so it is probably unneeded. Dropping it is left to a
      # change of its own: the install is seconds, and a failed release is not.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Authenticate to crates.io (Trusted Publishing)
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      - name: Run release-plz
        # Pinned to a full version: release-plz/action does NOT publish a
        # moving major tag, so `@v0` resolves to nothing and the job fails at
        # "Set up job" before running a step. (actions/checkout@v6 works
        # because that repo does publish v6 — the convention is not universal.)
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # ── Who holds which token ────────────────────────────────────────────────
  #
  # Every publish below is two jobs. The first decides and verifies — `npm ci`,
  # `go test`, `dart pub get` and `dart test`, all of which run code from
  # third-party packages — with read-only permissions, no OIDC token and no
  # credentials left in `.git/config`. The second runs no package code at all:
  # it re-reads the decision from its own checkout and does the one privileged
  # thing (publish, push a tag). Its checkout persists no credentials either;
  # scripts/git-push-with-token.sh hands the token to the one `git push` that
  # needs it.
  #
  # A leg of the second job runs only once the same leg of the first has
  # passed — it downloads that leg's marker artifact, which exists only on
  # success — so one package's failed verification holds back that package
  # and no other. Both jobs share one matrix (a YAML anchor), so the legs pair
  # up by construction.

  # ── npm ──────────────────────────────────────────────────────────────────
  #
  # release-plz is Rust-only: it cannot touch a non-Rust manifest, so each
  # package's bump is computed by scripts/release-bump-ts.sh (conventional
  # commits since the package's last release tag) and rides in the same
  # Release PR as the crates. See RELEASING.md.
  # One matrix entry per npm package. The core is @openvtc/trust-tasks; the
  # sibling packages (-proof, -tsp) publish from their own directories under
  # their own tag prefix. Each is skipped when its version is already on npm, so
  # a feature merge is a no-op and the first publish of a new package (which npm
  # trusted publishing cannot bootstrap) is done by hand — see RELEASING.md.
  #
  # `build-npm` installs, builds and packs the tarball; `publish-npm` publishes
  # that tarball as built, with provenance, and tags it.
  build-npm:
    # Publishes only from main, including a manual re-run.
    if: github.ref == 'refs/heads/main'
    name: Build ${{ matrix.name }} for npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &npm-packages
        include:
          - name: "@openvtc/trust-tasks"
            dir: trust-tasks-ts
            prefix: trust-tasks-ts-v
          - name: "@openvtc/trust-tasks-proof"
            dir: trust-tasks-ts-proof
            prefix: trust-tasks-ts-proof-v
          - name: "@openvtc/trust-tasks-tsp"
            dir: trust-tasks-ts-tsp
            prefix: trust-tasks-ts-tsp-v
          - name: "@openvtc/trust-tasks-capability-client"
            dir: trust-tasks-ts-capability-client
            prefix: trust-tasks-ts-capability-client-v
          - name: "@openvtc/trust-tasks-gen"
            dir: trust-tasks-ts-gen
            prefix: trust-tasks-ts-gen-v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - &npm-decide
        name: Decide whether to publish
        id: decide
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps, build and pack
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/npm-pack"
          npm pack --pack-destination "$RUNNER_TEMP/npm-pack"

      - name: Upload the tarball
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-${{ matrix.dir }}
          path: ${{ runner.temp }}/npm-pack/*.tgz
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-npm:
    # Publishes only from main, including a manual re-run. Not skipped when
    # another package's build leg failed: each leg checks its own tarball.
    if: github.ref == 'refs/heads/main' && !cancelled()
    needs: build-npm
    name: Publish ${{ matrix.name }} to npm
    runs-on: ubuntu-24.04
    # 30, not 20: the publish is followed by up to 8 minutes of waiting for the
    # version to become public ("Confirm the version is public on npm").
    timeout-minutes: 30
    permissions:
      # `contents: write` so the tag can be pushed after a successful publish —
      # `<prefix>-v<version>` is what the next Release PR measures from, the npm
      # mirror of the `<crate>-v<version>` tags release-plz writes.
      contents: write
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    strategy:
      fail-fast: false
      matrix: *npm-packages
    concurrency:
      # Two pushes landing close together would both see the version as absent
      # from npm and both try to publish it; the loser fails on a duplicate.
      group: publish-npm-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # npm 12 (installed below for OIDC trusted publishing)
          # requires Node >= 22.22.2; Node 20 fails with EBADENGINE.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - *npm-decide

      # Present only when this package's build leg passed.
      - name: Download the tarball build-npm made
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-${{ matrix.dir }}
          path: ${{ runner.temp }}/npm-pack

      # The tarball comes from a job that ran third-party code, so check it is
      # the package and version this job decided to publish, from its own
      # checkout, and that it carries no `publishConfig` (which could send it
      # to another registry or tag) before it goes anywhere.
      - name: Check the tarball is the package decided on
        if: steps.decide.outputs.should_publish == 'true'
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          tarballs=("$RUNNER_TEMP"/npm-pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::expected exactly one tarball from build-npm, found: ${tarballs[*]}"
            exit 1
          fi
          manifest=$(tar -xzOf "${tarballs[0]}" package/package.json)
          got_name=$(jq -r '.name' <<<"$manifest")
          got_version=$(jq -r '.version' <<<"$manifest")
          if [ "$got_name" != "$NAME" ] || [ "$got_version" != "$VERSION" ]; then
            echo "::error::the tarball is $got_name@$got_version, not $NAME@$VERSION"
            exit 1
          fi
          if jq -e 'has("publishConfig")' <<<"$manifest" >/dev/null; then
            echo "::error::the tarball's package.json has a publishConfig; refusing to publish it"
            exit 1
          fi
          echo "TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships older.
      - name: Update npm
        if: steps.decide.outputs.should_publish == 'true'
        run: npm install -g npm@12.2.2

      # No NODE_AUTH_TOKEN: with trusted publishing npm mints a short-lived
      # token via OIDC and attaches build provenance automatically. Publishing
      # the packed tarball runs none of the package's scripts.
      #
      # A version npm is holding as STAGED (below) answers a second publish with
      # an opaque 409; say what it means.
      - name: npm publish (trusted publishing)
        if: steps.decide.outputs.should_publish == 'true'
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -uo pipefail
          npm publish "$TARBALL" --access public 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ] && grep -q 'previously staged version' "$RUNNER_TEMP/npm-publish.log"; then
            echo "::error::$NAME@$VERSION is already STAGED on npm, awaiting a maintainer. Approve it (npm stage list $NAME, then npm stage approve <stage-id>, with 2FA) or reject it (npm stage reject <stage-id>), then re-run this job."
          fi
          exit "$status"

      # The tag is the anchor for the NEXT Release PR: release-bump-ts.sh reads
      # commits since `trust-tasks-ts-v<version>` to decide the bump and to
      # generate the changelog section. Without it the package would be
      # measured from nothing and every run would propose the whole history.
      - name: Tag the npm release
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          PREFIX: ${{ matrix.prefix }}
          NAME: ${{ matrix.name }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${PREFIX}$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::notice::$tag already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          ./scripts/git-push-with-token.sh origin "$tag"

      # `npm publish` succeeding does not mean the version is public. When the
      # trusted publisher lacks "Allow npm publish" (stage-only, npm's default
      # for configs created after 2026-09-03) or the package requires
      # proof-of-presence, npm STAGES the upload instead: the job is green, the
      # version is invisible, and nothing says so. 0.27.4 sat staged for 85
      # minutes that way. So confirm it is installable, and fail loudly if not.
      #
      # After the tag, deliberately: a staged version already holds its version
      # number, and the tag is what the next Release PR measures from. A re-run
      # once it is approved sees the version on npm and skips every step.
      - name: Confirm the version is public on npm
        if: steps.decide.outputs.should_publish == 'true'
        env:
          NAME: ${{ matrix.name }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 16); do
            if [ "$(npm view "$NAME@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "::notice::$NAME@$VERSION is public on npm."
              exit 0
            fi
            sleep 30
          done
          echo "::error::$NAME@$VERSION was accepted by npm but is not public after 8 minutes, so npm has almost certainly STAGED it. A maintainer must approve it with 2FA (npm stage list $NAME, then npm stage approve <stage-id>) and then re-run this job. To stop CI publishes being staged, tick 'Allow npm publish' on the package's trusted publisher (npmjs.com, package Settings, Trusted publishing)."
          exit 1

  # ── Go ───────────────────────────────────────────────────────────────────
  #
  # The third registry, and the only one with no registry at all: a Go module is
  # published by pushing a tag to a public repository, after which
  # proxy.golang.org fetches and serves it. There is no account, no token and no
  # OIDC exchange — which also means nothing here can be "configured wrong" in
  # the way the crates.io and npm Trusted Publishers can.
  #
  # The tag MUST be `trust-tasks-go/vX.Y.Z`. For a module in a subdirectory the
  # go tooling derives the tag prefix from the subdirectory, so this spelling is
  # a requirement rather than a convention — unlike the `trust-tasks-ts-v*` and
  # `<crate>-v*` tags elsewhere in this file, which are ours to choose.
  # One matrix entry per Go module: the core, and the three nested modules that
  # version independently on their own `trust-tasks-go/<name>/vX.Y.Z` tags
  # (proof, didcomm and capabilityclient). tsp is deliberately absent — it depends on the
  # unpublished affinidi-tsp-go and so cannot be released. Each leg reads its own
  # `const Version`, and the nested legs' verify step fetches the published core.
  #
  # `verify-go` builds, vets and tests; `publish-go` pushes the tag.
  verify-go:
    # Publishes only from main, including a manual re-run.
    if: github.ref == 'refs/heads/main'
    name: Verify ${{ matrix.name }} before tagging
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &go-modules
        include:
          - name: trust-tasks-go
            dir: trust-tasks-go
            versionfile: trust-tasks-go/trusttasks/version.go
            tagprefix: trust-tasks-go/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go
          - name: trust-tasks-go/proof
            dir: trust-tasks-go/proof
            versionfile: trust-tasks-go/proof/version.go
            tagprefix: trust-tasks-go/proof/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go/proof
          - name: trust-tasks-go/didcomm
            dir: trust-tasks-go/didcomm
            versionfile: trust-tasks-go/didcomm/version.go
            tagprefix: trust-tasks-go/didcomm/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go/didcomm
          - name: trust-tasks-go/capabilityclient
            dir: trust-tasks-go/capabilityclient
            versionfile: trust-tasks-go/capabilityclient/version.go
            tagprefix: trust-tasks-go/capabilityclient/v
            module: github.com/trustoverip/dtgwg-trust-tasks-tf/trust-tasks-go/capabilityclient
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - &go-decide
        name: Decide whether to publish
        id: decide
        env:
          VERSION_FILE: ${{ matrix.versionfile }}
          TAG_PREFIX: ${{ matrix.tagprefix }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' "$VERSION_FILE")
          if [ -z "$version" ]; then
            echo "::error::Could not read \`const Version\` from $VERSION_FILE"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${TAG_PREFIX}${version}" >/dev/null; then
            echo "::notice::${TAG_PREFIX}${version} already tagged — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${TAG_PREFIX}${version} is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - &go-setup
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.decide.outputs.should_publish == 'true'
        with:
          go-version: "1.24"
          cache: false

      # Publishing is irreversible in a way npm and crates.io are not: the module
      # proxy caches a tag permanently and by design, so a tag pushed over a tree
      # that does not build is served to every consumer forever and cannot be
      # retracted, only superseded. Build and test before tagging, not after.
      - name: Verify the module before tagging
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          go build ./...
          go vet ./...
          go test ./...
          mkdir -p "$RUNNER_TEMP/verified"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/verified/sha"

      # The leg index names the marker: a module path has slashes, which an
      # artifact name cannot.
      - name: Record that this module passed
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-verified-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verified/sha
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-go:
    # Publishes only from main, including a manual re-run. Not skipped when
    # another module's verify leg failed: each leg checks its own marker.
    if: github.ref == 'refs/heads/main' && !cancelled()
    needs: verify-go
    name: Publish ${{ matrix.name }} (tag + module proxy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The tag IS the publication, so this is the one permission that matters.
      contents: write
    strategy:
      fail-fast: false
      matrix: *go-modules
    concurrency:
      group: publish-go-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - *go-decide

      # Present only when this module's verify leg passed.
      - name: Require the verify leg to have passed
        if: steps.decide.outputs.should_publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: go-verified-${{ strategy.job-index }}
          path: ${{ runner.temp }}/verified

      # The marker names the commit it verified. Artifacts outlive an attempt,
      # so a re-run must not tag on the strength of another commit's marker.
      - &verified-sha
        name: Require the marker to be for this commit
        if: steps.decide.outputs.should_publish == 'true' || steps.decide.outputs.should_tag == 'true'
        run: |
          if [ "$(cat "$RUNNER_TEMP/verified/sha")" != "$GITHUB_SHA" ]; then
            echo "::error::the verify marker is for $(cat "$RUNNER_TEMP/verified/sha"), not $GITHUB_SHA"
            exit 1
          fi

      # For `go list` in the proxy warm-up only; nothing here builds the module.
      - *go-setup

      - name: Tag the release
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          NAME: ${{ matrix.name }}
          TAG_PREFIX: ${{ matrix.tagprefix }}
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${TAG_PREFIX}${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          ./scripts/git-push-with-token.sh origin "$tag"

      # Ask the module proxy for the version so it fetches and caches it now.
      # Without this the first consumer to run `go get` pays the fetch, and a
      # failure there surfaces to them rather than here.
      - name: Warm proxy.golang.org
        if: steps.decide.outputs.should_publish == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          MODULE: ${{ matrix.module }}
          GOPROXY: https://proxy.golang.org
        run: |
          set -euo pipefail
          # The proxy polls for new tags; it can take a minute to see one.
          for attempt in 1 2 3 4 5 6; do
            if go list -m "$MODULE@v$VERSION" 2>/dev/null; then
              echo "::notice::proxy.golang.org is serving $MODULE@v$VERSION"
              exit 0
            fi
            echo "attempt $attempt: not yet indexed, waiting 20s"
            sleep 20
          done
          # Not a failure: the tag is pushed, which IS the publication, and the
          # proxy will index it on its own schedule.
          echo "::warning::proxy.golang.org has not indexed $MODULE@v$VERSION yet. The tag is pushed; the proxy will pick it up. Verify with: go list -m $MODULE@v$VERSION"

  # ── Dart ─────────────────────────────────────────────────────────────────
  #
  # The odd one out: pub.dev only accepts an automated publish when the workflow
  # run was triggered by a TAG push, which it checks in the OIDC token's claims.
  # So nothing here publishes — `verify-dart` checks each package and
  # `tag-dart` writes the tag, and `publish-dart.yml` (triggered by that tag)
  # does the publishing.
  #
  # One matrix entry per Dart package, the core first. `tag-dart` runs one leg
  # at a time in that order, so the core's tag goes out before its consumers'.
  # Adding a package: an entry here, one in DART_PACKAGES and a case
  # arm in scripts/release-bump-dart.sh (both read by release-pr.sh), and the
  # tag pattern and `case` arm in publish-dart.yml.
  #
  # A package built on `trust_tasks` is verified against the *published* core
  # (below). One Release PR can bump the core and a dependent together; if the
  # dependent needs core API that was unreleased until this merge, its verify
  # leg fails, the core is still tagged and published, and the dependent is
  # not. Re-run the failed jobs once the core is live on pub.dev. The failure
  # also holds back `release-pr` until then.
  verify-dart:
    # Publishes only from main, including a manual re-run.
    if: github.ref == 'refs/heads/main'
    name: Verify ${{ matrix.name }} before tagging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: &dart-packages
        include:
          - name: trust_tasks
            dir: trust-tasks-dart
            prefix: trust-tasks-dart-v
          - name: trust_tasks_proof
            dir: trust-tasks-dart-proof
            prefix: trust-tasks-dart-proof-v
          - name: trust_tasks_https
            dir: trust-tasks-dart-https
            prefix: trust-tasks-dart-https-v
          - name: trust_tasks_didcomm
            dir: trust-tasks-dart-didcomm
            prefix: trust-tasks-dart-didcomm-v
          - name: trust_tasks_capability_client
            dir: trust-tasks-dart-capability-client
            prefix: trust-tasks-dart-capability-client-v
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - &dart-decide
        name: Decide whether to tag
        id: decide
        env:
          DIR: ${{ matrix.dir }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *//p' "$DIR/pubspec.yaml" | head -1 | tr -d '\r')
          if [ -z "$version" ]; then
            echo "::error::Could not read \`version\` from $DIR/pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$PREFIX$version" >/dev/null; then
            echo "::notice::$PREFIX$version already tagged — skipping."
            echo "should_tag=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$PREFIX$version is new — tagging."
            echo "should_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: steps.decide.outputs.should_tag == 'true'
        with:
          sdk: stable

      # Verify before tagging, not after: the tag is what pub.dev publishes from,
      # and a published version cannot be replaced — only superseded.
      #
      # pubspec_overrides.yaml is removed first. In CI it points a package at
      # the in-tree `trust_tasks`; a consumer gets the published one, so that is
      # what a release must pass against. A package that needs core API nobody
      # has released yet fails here, and the fix is to release the core first.
      #
      # `git rm`, not `rm`: a tracked file missing from the working tree makes
      # `dart pub publish --dry-run` warn that a checked-in file is ignored, and
      # exit 65. Removing it from the index as well keeps the dry run clean.
      - name: Verify the package before tagging
        if: steps.decide.outputs.should_tag == 'true'
        working-directory: ${{ matrix.dir }}
        run: |
          git rm -q --ignore-unmatch pubspec_overrides.yaml
          dart pub get
          dart analyze --fatal-infos
          dart test
          # The same dry run publish-dart.yml performs, surfaced here where a
          # failure costs a re-run rather than a burnt version number.
          dart pub publish --dry-run
          mkdir -p "$RUNNER_TEMP/verified"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/verified/sha"

      - name: Record that this package passed
        if: steps.decide.outputs.should_tag == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-verified-${{ matrix.dir }}
          path: ${{ runner.temp }}/verified/sha
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  tag-dart:
    # Publishes only from main, including a manual re-run. Not skipped when
    # another package's verify leg failed: each leg checks its own marker.
    if: github.ref == 'refs/heads/main' && !cancelled()
    needs: verify-dart
    name: Tag ${{ matrix.name }} for pub.dev
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: *dart-packages
    concurrency:
      group: tag-dart-${{ matrix.dir }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - *dart-decide

      # Present only when this package's verify leg passed.
      - name: Require the verify leg to have passed
        if: steps.decide.outputs.should_tag == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dart-verified-${{ matrix.dir }}
          path: ${{ runner.temp }}/verified

      - *verified-sha

      - name: Tag the release
        if: steps.decide.outputs.should_tag == 'true'
        env:
          NAME: ${{ matrix.name }}
          PREFIX: ${{ matrix.prefix }}
          VERSION: ${{ steps.decide.outputs.version }}
          HAVE_PAT: ${{ secrets.RELEASE_PLZ_TOKEN != '' }}
          # A tag pushed by the default GITHUB_TOKEN does not trigger
          # `publish-dart.yml`, so prefer the PAT when there is one, and say so
          # out loud when there is not.
          PUSH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$PREFIX$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$NAME $VERSION"
          ./scripts/git-push-with-token.sh origin "$tag"
          if [ "$HAVE_PAT" != "true" ]; then
            echo "::warning::$tag was pushed with the default GITHUB_TOKEN, so publish-dart.yml will NOT have been triggered and $VERSION is NOT on pub.dev. Delete and re-push the tag from a workstation to publish it: git push --delete origin $tag && git push origin $tag"
          fi

  # ── The Release PR ───────────────────────────────────────────────────────
  #
  # ONE PR for every package, opened and refreshed by scripts/release-pr.sh:
  # `release-plz update` for the crates, then scripts/release-bump-*.sh for
  # each npm package, Go module and Dart package, committed together. This
  # replaced thirteen per-package Release PRs, each of which was regenerated —
  # and its CI restarted — every time another one merged.
  #
  # Two jobs, like the publishes. `release-pr` runs `release-pr.sh prepare`
  # (release-plz, git-cliff and the bump scripts) read-only and with no token,
  # and uploads the resulting change as a patch. `release-pr-open` runs
  # `release-pr.sh open`, which applies that patch, commits it and pushes the
  # branch and PR with the release token, and runs nothing else.
  release-pr:
    name: Release PR
    runs-on: ubuntu-24.04
    # The API checks moved to every pull request (`rs API compatibility` in
    # rust.yml), so this job no longer builds rustdoc and finishes in about a
    # minute. It took 8-13 minutes, and was repeatedly killed for memory, while
    # release-plz ran cargo-semver-checks here.
    timeout-minutes: 30
    # MUST run after every publish job. Each bump is measured from the tag (or,
    # for the crates, the registry version) that those jobs write, so running
    # beside them means the push that merges a release computes the next one
    # against the PREVIOUS release and immediately reopens a PR for what just
    # went out. (A matrix `needs` waits for every leg.)
    needs: [release-plz-release, build-npm, publish-npm, verify-go, publish-go, verify-dart, tag-dart]
    # Not after a failed publish: the half-published state is for a human to
    # finish (re-run the failed job), and proposing the next release on top of
    # it would only muddy which versions are actually out. Skipped legs are
    # fine — that is an ordinary feature merge.
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
    concurrency:
      # Serialising PR updates just coalesces them; the branch is derived, so
      # the last run to finish writes the right tree.
      group: release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history + tags: every bump is measured from a tag, and a
          # shallow clone produces a correct bump with an empty changelog.
          fetch-depth: 0

      # Kept from when this job ran cargo-semver-checks, whose rustdoc builds
      # compile the binding crates' TDK dependencies (they probe for libdbus-1
      # via pkg-config). Nothing has shown that `release-plz update` never runs
      # a build script, and the install is seconds.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. The
          # *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # No cargo-semver-checks: `semver_check = false` in release-plz.toml, and
      # the crates are checked on every PR instead (`rs API compatibility`).
      # git-cliff is for the non-Rust changelogs, from the same cliff.toml
      # release-plz reads, so every part of a release reads alike.
      #
      # release-plz is PINNED to 0.3.171. install-action ships the static
      # x86_64-unknown-linux-musl build, and 0.3.172 is the first to carry
      # pest >= 2.9.3, which refuses to parse when stacker::remaining_stack()
      # reports under 64 KiB. On musl that figure is wrong for the main thread
      # (rust-lang/stacker#155: pthread_getattr_np reports only the stack mapped
      # so far, ~128 KiB), so Tera fails on the first line of every changelog
      # template — `Template parse error: --> 1:1 | # Changelog | stack limit
      # reached` — and no Release PR can be built. `ulimit -s` cannot help; the
      # gnu build and 0.3.171 (pest 2.9.2) both work. Unpin once a release-plz
      # release carries a stacker with #155 fixed: check by running
      # `release-plz update` from the musl build on a commit with unreleased
      # changes. (The publish job is unaffected — release-plz/action installs
      # its own default, 0.3.160.)
      - name: Install release-plz and git-cliff
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: release-plz@0.3.171,git-cliff@2.14.2

      - name: Compute the release
        run: ./scripts/release-pr.sh prepare "$RUNNER_TEMP/release-pr"

      - name: Upload the release change
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release-pr-open:
    name: Open or update the Release PR
    needs: release-pr
    if: ${{ github.ref == 'refs/heads/main' && !cancelled() && needs.release-pr.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-open-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # The commit the patch was computed against; no history is needed to
      # apply it, commit it and push the branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release change
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-pr
          path: ${{ runner.temp }}/release-pr

      # The same token for `gh` and for the branch push, so both come from one
      # identity. With a PAT in RELEASE_PLZ_TOKEN that also means CI actually
      # runs on the Release PR — GitHub suppresses workflow runs for events
      # authored by the default GITHUB_TOKEN, and the one commit that publishes
      # must not be the one commit CI never built.
      - name: Open or update the Release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/release-pr.sh open "$RUNNER_TEMP/release-pr"
