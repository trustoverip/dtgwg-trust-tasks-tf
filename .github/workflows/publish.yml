name: Publish packages

# Publishes the Rust crate (trust-tasks-rs) to crates.io and the TypeScript
# package (@openvtc/trust-tasks) to npm when an approved PR lands on main.
#
# Each package publishes ONLY when its manifest version is newer than what is
# already on the registry, so unrelated pushes to main (docs, specs, website)
# are no-ops. Bump the version in the manifest (and changelog) to release —
# see CLAUDE.md "Changing a spec or payload schema — bump and republish".
on:
  push:
    branches: [main]
    # Watch every crate this workflow publishes (see the `CRATES` list below).
    # The binding crates were previously omitted, so a binding-only change (e.g. a
    # bump to `trust-tasks-tsp` with no `trust-tasks-rs`/spec change) merged to main
    # without triggering a publish, stranding the new version on the registry.
    paths:
      - "trust-tasks-rs/**"
      - "trust-tasks-https/**"
      - "trust-tasks-didcomm/**"
      - "trust-tasks-didcomm-v1/**"
      - "trust-tasks-proof/**"
      - "trust-tasks-tsp/**"
      - "trust-tasks-capability-client/**"
      - "trust-tasks-ts/**"
      - "specs/**"
      - ".github/workflows/publish.yml"
  # Manual escape hatch to re-run a publish (e.g. after fixing the trigger) without
  # needing a fresh commit to a watched path.
  workflow_dispatch:

# Never let two runs publish the same ref at once.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-rust:
    name: Publish Rust crates to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for crates.io trusted publishing (OIDC)
    # Publish order matters: trust-tasks-rs must land before the sibling
    # bindings, which depend on it by `version`. The siblings don't depend on
    # each other, so any order among them is fine. trust-tasks-codegen is
    # publish=false (internal generator) and deliberately absent here. Each
    # crate must have its own Trusted Publisher configured on crates.io for
    # this repo + publish.yml, or its `cargo publish` will fail auth.
    env:
      CRATES: "trust-tasks-rs trust-tasks-https trust-tasks-didcomm trust-tasks-didcomm-v1 trust-tasks-proof trust-tasks-tsp trust-tasks-capability-client"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The sibling bindings pull in Affinidi's TDK (keyring / secret-storage),
      # whose build scripts probe for libdbus-1 via pkg-config — same as the
      # `test`/`package` jobs in rust.yml.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Decide which crates to publish
        id: decide
        run: |
          set -euo pipefail
          to_publish=""
          needs_manual=""
          already=""
          for crate in $CRATES; do
            meta=$(cargo metadata --no-deps --format-version 1 \
              --manifest-path "$crate/Cargo.toml")
            version=$(echo "$meta" | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | .version')

            # Respect the manifest `publish` flag. `publish = false` => cargo
            # metadata reports `publish: []`; `true` / unset / an explicit
            # registry list are all publishable. Mirrors cargo's own gate.
            publishable=$(echo "$meta" | jq -r --arg c "$crate" '.packages[] | select(.name==$c) | if .publish == [] then "false" else "true" end')
            if [ "$publishable" != "true" ]; then
              echo "::notice::$crate has publish=false — skipping."
              continue
            fi

            # Skip if this exact version is already on crates.io. The crates.io
            # API rejects requests without a User-Agent (403), so set one. A
            # brand-new crate name returns 404 — that is "never published, so
            # publish it", NOT an error (the old `curl -f` aborted the whole
            # step on it). Distinguish 404 (new) from a real lookup failure.
            http_code=$(curl -sSL -o crate.json -w '%{http_code}' \
              -H "User-Agent: trust-tasks-ci (github-actions)" \
              "https://crates.io/api/v1/crates/$crate" || echo "000")
            if [ "$http_code" = "404" ]; then
              # A crate that does not exist yet CANNOT be published from here.
              # crates.io rejects it with "Trusted Publishing tokens do not
              # support creating new crates" — by design, since there is no
              # crate for a Trusted Publisher to be attached to. Collect these
              # and report them together at the end rather than letting the
              # publish step die on a mid-run 403 with no summary.
              echo "::warning::$crate is not on crates.io yet — needs a manual first publish."
              needs_manual="$needs_manual $crate"
            elif [ "$http_code" = "200" ]; then
              existing=$(jq -r --arg v "$version" '[.versions[]?.num] | index($v) // "no"' crate.json)
              if [ "$existing" != "no" ]; then
                echo "::notice::$crate $version already on crates.io — skipping."
                already="$already $crate@$version"
              else
                echo "::notice::$crate $version is new — will publish."
                to_publish="$to_publish $crate"
              fi
            else
              echo "::error::crates.io lookup for $crate failed (HTTP $http_code)"
              exit 1
            fi
          done
          to_publish="$(echo "$to_publish" | xargs || true)"
          needs_manual="$(echo "$needs_manual" | xargs || true)"
          already="$(echo "$already" | xargs || true)"
          echo "to_publish=$to_publish" >> "$GITHUB_OUTPUT"
          echo "needs_manual=$needs_manual" >> "$GITHUB_OUTPUT"
          echo "already=$already" >> "$GITHUB_OUTPUT"

          {
            echo "### crates.io"
            echo
            if [ -n "$to_publish" ]; then
              echo "**To publish:** $to_publish"
            else
              echo "**To publish:** nothing — every version is already on crates.io."
            fi
            [ -n "$already" ] && echo && echo "**Already current:** $already"
            if [ -n "$needs_manual" ]; then
              echo
              echo "**⚠ Needs a manual first publish:** $needs_manual"
              echo
              echo 'Trusted Publishing cannot create a crate that does not exist yet. For each:'
              echo
              echo '```sh'
              for c in $needs_manual; do echo "cargo publish -p $c"; done
              echo '```'
              echo
              echo 'Then add a Trusted Publisher for it on crates.io (this repo + publish.yml)'
              echo 'so the next release goes through CI.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Mint a short-lived crates.io token via OIDC (trusted publishing). No
      # long-lived CRATES_API_KEY secret needed. The token is scoped to the
      # crates whose Trusted Publisher matches this repo + workflow, so a
      # single auth covers all of them.
      - name: Authenticate to crates.io
        id: auth
        if: steps.decide.outputs.to_publish != ''
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        if: steps.decide.outputs.to_publish != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        # Publish in $CRATES order so trust-tasks-rs precedes its dependents.
        # `cargo publish` waits for each new version to appear in the index
        # before returning, so a dependent published next resolves cleanly.
        run: |
          set -uo pipefail
          published=""
          failed=""
          for crate in ${{ steps.decide.outputs.to_publish }}; do
            echo "::group::cargo publish -p $crate"
            if cargo publish -p "$crate"; then
              published="$published $crate"
            else
              # Stop at the first failure: the crates are ordered by dependency,
              # so continuing risks publishing a dependent against a version of
              # trust-tasks-rs that never landed. Record what did publish so the
              # partial state is stated rather than inferred from the log.
              failed="$crate"
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done

          {
            echo
            echo "**Published:** ${published:-none}"
            if [ -n "$failed" ]; then
              echo
              echo "**Failed:** $failed"
              remaining=$(echo "${{ steps.decide.outputs.to_publish }}" \
                | tr ' ' '\n' | sed -n "/^$failed\$/,\$p" | tail -n +2 | xargs || true)
              [ -n "$remaining" ] && echo && echo "**Not attempted:** $remaining"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ -z "$failed" ] || exit 1

      - name: Report crates needing a manual first publish
        if: steps.decide.outputs.needs_manual != ''
        run: |
          echo "::error::These crates are not on crates.io and cannot be created by Trusted Publishing: ${{ steps.decide.outputs.needs_manual }}"
          echo "Publish each manually once, then add its Trusted Publisher. See the job summary."
          exit 1

  publish-npm:
    name: Publish @openvtc/trust-tasks to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # npm@latest (v12+, installed below for OIDC trusted publishing)
          # requires Node >= 22.22.2; Node 20 fails with EBADENGINE.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1; Node 20 ships older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Decide whether to publish
        id: decide
        working-directory: trust-tasks-ts
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version already on npm — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$name@$version is new — publishing."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps & build
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: trust-tasks-ts
        run: |
          npm ci
          npm run build

      # No NODE_AUTH_TOKEN: with trusted publishing npm mints a short-lived
      # token via OIDC and attaches build provenance automatically.
      - name: npm publish (trusted publishing)
        if: steps.decide.outputs.should_publish == 'true'
        working-directory: trust-tasks-ts
        run: npm publish --access public
