name: CLI binaries

# Prebuilt `trust-tasks` binaries on the GitHub Release of each
# `trust-tasks-cli-vX.Y.Z` tag (#1128), so a TypeScript, Go or Dart developer
# can pin tasks without a Rust toolchain. `cargo binstall trust-tasks-cli`
# fetches the same archives ([package.metadata.binstall] in
# trust-tasks-cli/Cargo.toml names them; change both together).
#
# ── How it is triggered ─────────────────────────────────────────────────────
#
# `release-plz release` in publish.yml creates the tag and the GitHub Release
# with the default GITHUB_TOKEN, and GitHub starts no workflow for an event
# that token authored — a `push: tags` or `release: published` trigger here
# would never fire. So publish.yml CALLS this workflow (`cli-binaries` job),
# with the tag release-plz reports for `trust-tasks-cli`, in the same run.
# An ordinary merge releases nothing and the call is skipped.
#
# `workflow_dispatch` is the manual path: attach binaries to a release made
# before this workflow existed, or re-run one whose upload failed. The tag's
# own sources are built, with the tag's rust-toolchain.toml when it has one.
#
# ── Who holds which token ───────────────────────────────────────────────────
#
# As in publish.yml: the `build` legs compile third-party code (build scripts)
# with a read-only token and no persisted credentials; `upload` compiles
# nothing and is the only job with `contents: write`.
#
# Asset names: trust-tasks-cli-<version>-<target>.tar.gz (.zip on Windows),
# holding the `trust-tasks` binary at the archive root, plus one
# `<asset>.sha256` per archive and a combined SHA256SUMS.

on:
  workflow_call:
    inputs:
      tag:
        description: "The trust-tasks-cli release tag, e.g. trust-tasks-cli-v0.2.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The trust-tasks-cli release tag, e.g. trust-tasks-cli-v0.2.0 (its GitHub Release must exist)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc builds on 22.04, so the binary runs on any distribution with
          # glibc 2.35 or newer, not only on the runner's.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            run: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
            run: true
          - target: aarch64-apple-darwin
            os: macos-14
            archive: tar.gz
            run: true
          # Cross-compiled on the arm64 runner (Xcode's clang targets both);
          # not run, since the runner has no Rosetta.
          - target: x86_64-apple-darwin
            os: macos-14
            archive: tar.gz
            run: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            archive: zip
            run: true
    steps:
      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^trust-tasks-cli-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a trust-tasks-cli-vX.Y.Z tag"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # Not ./.github/actions/rust-toolchain: that action is read from the
      # checkout, and an older tag (trust-tasks-cli-v0.2.0) predates it and
      # rust-toolchain.toml. Same effect when the file is there.
      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [ -f rust-toolchain.toml ]; then
            rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
            rustup default stable
          fi
          rustup target add "$TARGET"
          rustc --version
          echo "CARGO_TERM_COLOR=always" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          # No MSVC runtime DLL needed on the user's machine.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked -p trust-tasks-cli --target "$TARGET"

      - name: Smoke test
        if: matrix.run
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          out=$("target/$TARGET/release/trust-tasks" --version)
          echo "$out"
          # clap prints "trust-tasks <version>"; the tag must be that version.
          if [ "$out" != "trust-tasks ${TAG#trust-tasks-cli-v}" ]; then
            echo "::error::the binary reports '$out', the tag is $TAG"
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          version="${TAG#trust-tasks-cli-v}"
          name="trust-tasks-cli-${version}-${TARGET}"
          mkdir -p dist stage
          if [ "$ARCHIVE" = zip ]; then
            cp "target/$TARGET/release/trust-tasks.exe" stage/
            (cd stage && 7z a -tzip "../dist/${name}.zip" trust-tasks.exe)
          else
            cp "target/$TARGET/release/trust-tasks" stage/
            tar -C stage -czf "dist/${name}.tar.gz" trust-tasks
          fi
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  upload:
    name: Attach to the GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Uploading release assets. Nothing here builds or runs package code.
      contents: write
    concurrency:
      group: cli-binaries-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for f in trust-tasks-cli-*; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum trust-tasks-cli-*.tar.gz trust-tasks-cli-*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # release-plz has created the release (git_release_enable); refuse
          # rather than create a bare one if it has not.
          gh release view "$TAG" > /dev/null
          # --clobber: a re-run replaces what a failed attempt left behind.
          gh release upload "$TAG" ./* --clobber
