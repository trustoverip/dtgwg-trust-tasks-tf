name: Rust

on:
  push:
    branches: [main]
  # No `branches:` filter — see the note in ts.yml.
  pull_request:
    paths:
      - "trust-tasks/**"
      - "trust-tasks-rs/**"
      - "trust-tasks-codegen/**"
      - "trust-tasks-build/**"
      - "examples/**"
      - "trust-tasks-https/**"
      - "trust-tasks-didcomm/**"
      # These three were missing, so a change to one of them ran no Rust CI at
      # all. It matters more now: `publication-order` reads every publishable
      # crate's manifest, and a dev-dependency added in an unwatched crate is
      # exactly the edit that guard exists to catch.
      - "trust-tasks-didcomm-v1/**"
      - "trust-tasks-capability-client/**"
      - "trust-tasks-ceremony/**"
      - "trust-tasks-proof/**"
      - "trust-tasks-tsp/**"
      - "trust-tasks-cli/**"
      # The by-digest store script the `cli` job builds its registry with.
      - "scripts/write-by-digest-store.sh"
      - "Cargo.toml"
      - "Cargo.lock"
      - "specs/**"
      # GETTING-STARTED.md's Rust is asserted equal to
      # examples/getting-started/src/main.rs by a test in trust-tasks,
      # so a doc-only edit still has to run cargo test.
      - "GETTING-STARTED.md"
      - ".github/workflows/rust.yml"
      # `cargo deny` reads this, so a change to it must run the job it
      # configures. Without it, the file that decides what the supply-chain
      # check bans is the one file that change cannot be tested by — the same
      # gap as the three crates noted above.
      - "deny.toml"

# A newer push to the same PR supersedes the run in flight, so cancel it rather
# than let it hold a runner. Keyed on the commit for every other event, so a run
# on `main` is never cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  # The test suite runs as three parallel jobs rather than three steps of one.
  # Each compiles trust-tasks-rs — with different features, or as rustdoc — so
  # as steps they could only queue behind each other, and the job took 10-19
  # minutes. The names are not required checks (branch protection requires only
  # `DCO`, `EasyCLA` and three non-Rust jobs), so they are free to change.
  test:
    name: cargo test (stable, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # trust-tasks-rs generates one module per specification, and its test
      # build under `--features validate` has peaked above a hosted runner's
      # 16 GB beside the TDK crates; the kernel then kills the job (exit 143)
      # mid-compile rather than failing it. Swap lets that peak page out
      # instead. The unit-test build no longer compiles the generated tree
      # (see `unit_test_gate` in trust-tasks-codegen), which roughly halved the
      # peak, so this is now a margin rather than a necessity.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from `main` only. A PR restores main's entry (GitHub lets a
          # PR read its base branch's cache) but its own saves were ~1 GB
          # copies under the same key, which filled the repository's 10 GB
          # quota and evicted the entries every run actually restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Affinidi's TDK pulls in keyring / secret-storage crates whose
      # build scripts probe for `libdbus-1` via pkg-config. Install the
      # dev headers so libdbus-sys finds the system library.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo test (default features)
        run: cargo test --workspace --all-targets

  test-validate:
    name: cargo test (trust-tasks-rs, --features validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # trust-tasks-rs generates one module per specification, and its test
      # build under `--features validate` has peaked above a hosted runner's
      # 16 GB beside the TDK crates; the kernel then kills the job (exit 143)
      # mid-compile rather than failing it. Swap lets that peak page out
      # instead. The unit-test build no longer compiles the generated tree
      # (see `unit_test_gate` in trust-tasks-codegen), which roughly halved the
      # peak, so this is now a margin rather than a necessity.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from `main` only. A PR restores main's entry (GitHub lets a
          # PR read its base branch's cache) but its own saves were ~1 GB
          # copies under the same key, which filled the repository's 10 GB
          # quota and evicted the entries every run actually restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo test (--features validate)
        run: cargo test -p trust-tasks-rs --features validate --all-targets

  # Every spec family is a Cargo feature, so a consumer — or a contributor
  # working on one family — can build trust-tasks-rs with only that family:
  # `cargo test -p trust-tasks-rs --no-default-features --features vault` is a
  # ~1 GB, seconds-long build where the default one is the whole registry. That
  # only holds while no test outside a family's own gate names it, which
  # nothing else checks: every other job builds with all families on. The
  # three below are the unit-test family (acl) and two that are not it.
  test-single-family:
    name: cargo test (trust-tasks-rs, one family at a time)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --no-default-features --features <family>
        run: |
          for family in acl vault keys; do
            echo "::group::$family"
            cargo test -p trust-tasks-rs --no-default-features --features "$family" --all-targets
            echo "::endgroup::"
          done

  # An application that generates its tasks at build time: three registry
  # versions and one from a third-party source pinned in
  # examples/consumer-app/trust-tasks.lock, their bundles vendored beside it,
  # `trust-tasks-rs` with `default-features = false`. Building it runs
  # trust-tasks-build (digest check + generation) in a real build.rs, and
  # running it is a round trip through the generated types. The whole job is
  # seconds where a build of the prebuilt modules is minutes — which is the
  # point of milestone 2 (docs/design/consumer-side-generation.md).
  consumer-app:
    name: example application (trust-tasks-build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo run -p trust-tasks-example-consumer-app
        run: cargo run -p trust-tasks-example-consumer-app
      - name: cargo test -p trust-tasks-build --all-features
        run: cargo test -p trust-tasks-build --all-features
      # The example's third-party fixture registry is what its specs build to
      # (`trust-tasks registry build`, the publisher's side), and the vendored
      # bundles are what the lock pins — offline, as an application's CI runs it.
      - name: fixture registry is up to date, and the lock verifies
        run: |
          cargo run -q -p trust-tasks-cli -- registry build \
            --specs examples/consumer-app/fixture-registry/specs \
            --type-uri-prefix https://tasks.example.com \
            --out examples/consumer-app/fixture-registry/site \
            --official-specs specs
          git diff --exit-code -- examples/consumer-app/fixture-registry
          test -z "$(git status --porcelain -- examples/consumer-app/fixture-registry)"
          cargo run -q -p trust-tasks-cli -- -C examples/consumer-app check

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from `main` only. A PR restores main's entry (GitHub lets a
          # PR read its base branch's cache) but its own saves were ~1 GB
          # copies under the same key, which filled the repository's 10 GB
          # quota and evicted the entries every run actually restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo doc
        # One job at a time. With the default parallelism, rustc checking
        # trust-tasks-rs (every generated spec module, all features) runs
        # beside rustdoc documenting it, and the two together peaked at
        # 16.1 GB on main and 19.7 GB with one more spec family — past the
        # 16 GB runner, which then kills the job with exit 143 and no error.
        # Serialised, the peak is 12.2 GB, at the cost of a slower job.
        run: cargo doc --workspace --no-deps --all-features -j 1
        env:
          RUSTDOCFLAGS: "-D warnings"

  # NOTE: every crate in this workspace ends up declaring MSRV 1.95 —
  # the Affinidi crate family requires it and the workspace resolves
  # under a single Cargo.lock. A separate MSRV job would just retest
  # the same toolchain as `test`. If the workspace ever splits its
  # resolver, a `msrv` job picking a lower toolchain will be
  # appropriate again.

  # A released specification is compiled into every library, so an in-place
  # edit that changes its generated types is a breaking release of the whole
  # core version group (#858, #758 and #750 each cost a MINOR; #819's mid-enum
  # insertion made 0.32.0 breaking). Caught here, on the pull request: a released
  # version may change only additively, and anything else is a new version.
  published-schemas:
    name: published schemas change only additively
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history AND tags: the comparison is against the last
          # trust-tasks-rs-v* release, and the script refuses to run without it.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Check every released spec changed only additively
        env:
          PUBLISHED_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-published-schemas.mjs

  # The crates' counterpart of `go API compatibility` and friends: each
  # published crate against its own last release, failing an incompatible
  # change the PR title does not declare with a `!`. This used to run inside
  # the Release PR job (release-plz's `semver_check`), after the merge and over
  # every generated module (~12.6 GB, 8-13 minutes, repeatedly killed for
  # memory). Here it compares the runtime plus one generated family and takes
  # about a minute; what it checks and why that is enough is in the script.
  api-compat:
    name: rs API compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Tags for the baselines, history for the "already breaking" check.
          fetch-depth: 0
      # A changed binding crate pulls in Affinidi's TDK, whose build scripts
      # probe for libdbus-1. See the `test` job for why `update` may fail.
      - name: Install libdbus-1-dev
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # Only a PR that changes a binding crate needs this: documenting one
      # compiles trust-tasks-rs with every family, ~13 GB resident, measured.
      # A standard runner has 16 GB; swap lets it finish under pressure. On
      # whichever of / and /mnt has more room, up to 16 GB, leaving 8 GB for
      # the builds — the runner image's disk layout is not ours to assume.
      - name: Add swap
        run: |
          sudo systemctl stop systemd-oomd || true
          sudo swapoff -a
          sudo rm -f /mnt/swapfile /swapfile
          root_free=$(df --output=avail -BG / | tail -1 | tr -dc 0-9)
          mnt_free=$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)
          if [ "$mnt_free" -gt "$root_free" ]; then dir=/mnt free=$mnt_free; else dir='' free=$root_free; fi
          size=$(( free - 8 < 16 ? free - 8 : 16 ))
          if [ "$size" -lt 4 ]; then
            echo "::warning::only ${free}G free; not adding swap"
          else
            sudo fallocate -l "${size}G" "$dir/swapfile"
            sudo chmod 600 "$dir/swapfile"
            sudo mkswap "$dir/swapfile"
            sudo swapon "$dir/swapfile"
          fi
          free -h
      - name: Compare with the last releases
        # The title is read through the API, never interpolated into the
        # script body (see go.yml's api-compat for why it is fetched now rather
        # than taken from the event: retitle, re-run, and this sees the change).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          # Lints from the published crates' own source are not this job's
          # business; cargo-semver-checks builds both trees.
          RUSTFLAGS: ""
        run: |
          PR_TITLE=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .title) || PR_TITLE="$EVENT_TITLE"
          export PR_TITLE
          scripts/check-rs-api-compat.sh

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Both feature sets, in parallel. Default features catch what is only
  # reachable without `validate` (an import used solely under a cfg); all
  # features catch the rest.
  clippy:
    name: cargo clippy (${{ matrix.features.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default features, flags: "" }
          - { name: --all-features, flags: --all-features }
    steps:
      - uses: actions/checkout@v6
      # The same margin the `test` job has, for the same reason: checking the
      # whole workspace with every generated module beside the TDK crates has
      # peaked past a hosted runner's 16 GB, and the kernel then kills the job
      # (exit 143, "The runner has received a shutdown signal") rather than
      # failing it.
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 10G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per feature set: the two builds share almost nothing in
          # `target/` for the workspace crates, and one key would let whichever
          # saved last overwrite the other.
          key: ${{ matrix.features.flags || 'default' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features.flags }} -- -D warnings

  # ── Where the per-PR version-bump gate used to be ───────────────────────
  #
  # A job here required every changed publishable crate to move its version in
  # the same PR, because publishing was a side effect of merging: a change that
  # merged without a bump would sit on main while crates.io kept serving the
  # old tarball under the same number.
  #
  # release-plz removes the premise. `main` is now legitimately AHEAD of the
  # registry between releases, and the version each crate lands on is decided
  # by the Release PR from the conventional commits that accumulated — not by
  # whoever merged last. The gate would now fail every ordinary PR and force
  # exactly the early release decision this repo moved away from. See
  # RELEASING.md.
  #
  # What replaced its guarantee: release-plz releases every crate whose files
  # changed since its last release tag, so "changed but never republished" is
  # no longer something a human has to remember.

  # The topological publication-order guard, kept.
  #
  # It exists because a dev-dependency edge broke a release: #284 made
  # trust-tasks-proof a DEV-dependency of trust-tasks-https, and although
  # dev-dependencies are stripped for consumers, `cargo publish` still resolves
  # any dev-dependency that carries a `version` field — so it constrains
  # publication order exactly as a normal dependency does. trust-tasks-rs
  # 0.14.0 uploaded and the run then died on
  #   failed to select a version for the requirement `trust-tasks-proof = "^0.13"`.
  #
  # SETTLED, the hard way: release-plz does NOT count dev-dependency edges when
  # it orders the publish. The 0.17.0 release proved it. trust-tasks-rs,
  # -didcomm, -didcomm-v1 and -capability-client uploaded, then cargo tried to
  # package trust-tasks-https before trust-tasks-proof and died on
  #   failed to select a version for the requirement `trust-tasks-proof = "^0.17"`
  # leaving four of eight crates published — and crates.io uploads cannot be
  # undone. The edge had been there since #284 and was survivable only because
  # the requirement named an older, already-published version; lockstep
  # versioning moved it to one that did not exist yet.
  #
  # So the acyclicity tripwire was necessary but not sufficient: a valid order
  # existing does not mean release-plz will USE it. This job now enforces the
  # stronger, actually-sufficient rule — no intra-workspace dev-dependency may
  # carry a `version` field. Dropping `version` makes cargo strip the dep from
  # the published manifest, which removes the ordering constraint entirely
  # rather than relying on release-plz to honour it.
  #
  # The acyclicity check and the derived-order printout are kept below: the
  # first still catches genuine cycles among normal dependencies, and the
  # second is what a failed release gets compared against.
  publication-order:
    name: publication order is satisfiable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive the publication order from cargo metadata
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True, text=True, check=True).stdout)
          # publish = [] means publish=false; anything else is publishable.
          pkgs = {p["name"]: p for p in meta["packages"] if p.get("publish") != []}

          # Edges: pkg -> the workspace crates it must be published AFTER.
          # Every dependency kind counts, including dev — see the comment above.
          edges = {}
          kinds = {}
          for name, p in pkgs.items():
              deps = set()
              for d in p["dependencies"]:
                  if d["name"] in pkgs:
                      deps.add(d["name"])
                      kinds.setdefault((name, d["name"]), d.get("kind") or "normal")
              edges[name] = deps

          # THE ENFORCING RULE. Any intra-workspace dev-dependency carrying a
          # `version` constrains cargo's publication order while being invisible
          # to release-plz's. Fail before a release can half-complete.
          offenders = []
          for name, p in pkgs.items():
              for d in p["dependencies"]:
                  if d["name"] in pkgs and (d.get("kind") or "normal") == "dev" \
                          and d.get("req") not in (None, "*"):
                      offenders.append((name, d["name"], d["req"]))
          if offenders:
              for who, dep, req in sorted(offenders):
                  print(f"::error file={who}/Cargo.toml::{who} dev-depends on "
                        f"workspace crate {dep} with version \"{req}\". `cargo publish` "
                        f"resolves versioned dev-dependencies from the registry, so this "
                        f"forces {dep} to be published first — but release-plz does not "
                        f"count dev-dependency edges when ordering, so it may not be. "
                        f"That mismatch half-published the 0.17.0 release. Drop the "
                        f"`version` field and keep `path` only: cargo then strips the "
                        f"dependency at publish time and the constraint disappears.")
              sys.exit(1)

          order, seen = [], {}
          def visit(n, stack):
              state = seen.get(n)
              if state == "done":
                  return
              if state == "open":
                  cycle = " -> ".join(stack[stack.index(n):] + [n])
                  print(f"::error::Cycle in the publication graph: {cycle}. "
                        f"No publication order exists; cargo publish cannot succeed. "
                        f"Break it by dropping the `version` field from the dev-dependency in the cycle.")
                  sys.exit(1)
              seen[n] = "open"
              for d in sorted(edges[n]):
                  visit(d, stack + [n])
              seen[n] = "done"
              order.append(n)
          for n in sorted(edges):
              visit(n, [])

          print("Publication order (dependencies first):")
          for i, n in enumerate(order, 1):
              after = ", ".join(f"{d} [{kinds[(n, d)]}]" for d in sorted(edges[n])) or "-"
              print(f"  {i}. {n:<32} after: {after}")
          PY

  package:
    name: cargo package (trust-tasks-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Save from `main` only. A PR restores main's entry (GitHub lets a
          # PR read its base branch's cache) but its own saves were ~1 GB
          # copies under the same key, which filled the repository's 10 GB
          # quota and evicted the entries every run actually restores.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `cargo package` builds the publish tarball and then compiles a
      # clean copy. That second step catches the bug class where
      # generated code references files outside the crate root via
      # `include_str!` (those paths get excluded from the tarball and
      # the verify compile fails). One verify compile, with `validate`, covers
      # the default feature set too: nothing in the crate is compiled only
      # when `validate` is off (no `cfg(not(feature = "validate"))`, no build
      # script), so the default build is a strict subset and a second verify
      # compile of it was ~4 minutes that could only fail when this one did.
      # Should a `not(feature = "validate")` path ever appear, package the
      # default set again. Every other published
      # crate is packaged by `package-workspace`, on the Release PR only:
      # trust-tasks-rs is the one whose generated tree changes on ordinary
      # PRs, so it is the one worth checking on each of them.
      - name: Install libdbus-1-dev
        run: |
          # `apt-get update` exits non-zero when ANY configured source fails, and
          # the runner image ships Google's Chrome repo, which periodically serves
          # a Packages.gz whose hash does not match its Release file. This job
          # needs Ubuntu's archive and nothing else, so a failed update is not
          # informative — the *install* is the check, and it still fails loudly.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      - name: The validate build is a superset of the default one
        run: |
          if grep -rnE 'not\(\s*feature\s*=\s*"validate"' trust-tasks-rs --include='*.rs'; then
            echo "::error::trust-tasks-rs now has code compiled only without \`validate\`, so packaging with \`validate\` no longer covers the default build. Add back \`cargo package -p trust-tasks-rs\` (default features) to this job."
            exit 1
          fi
      - name: cargo package trust-tasks-rs (--features validate)
        run: cargo package -p trust-tasks-rs --features validate

  # The publish-time verify build, moved to the Release PR — release-plz.toml
  # sets `publish_no_verify` and says why. Every publishable crate's tarball is
  # packaged and compiled on its own, with its unpublished siblings supplied by
  # cargo's local registry overlay.
  #
  # Only on the Release PR: it is the one PR whose versions are about to be
  # uploaded, and the only one where a failure here means a release would
  # fail. A skipped job reports success, so this can be a required check
  # without holding up every other PR.
  package-workspace:
    name: cargo package (every published crate)
    if: github.event_name == 'pull_request' && github.head_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # No rust-cache: nothing on `main` runs this job, so there is never an
      # entry to restore. It runs beside the rest of the Release PR's checks.
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libdbus-1-dev
        run: |
          # See the `test` job.
          sudo apt-get update || true
          sudo apt-get install -y libdbus-1-dev pkg-config
      # `publish = false` crates are not uploaded, so they are not checked.
      - name: cargo package --workspace
        run: cargo package --workspace --exclude trust-tasks-codegen --exclude trust-tasks-example-consumer-app --exclude trust-tasks-example-getting-started

  # The `trust-tasks` CLI against the WHOLE registry, as deploy.yml publishes
  # it: every bundle, the index and the by-digest store, built here by the same
  # codegen and script. The `test` job already runs this crate's tests against
  # its fixture registry; this adds `full_registry_round_trip`, which is
  # skipped there because it needs `TRUST_TASKS_TEST_REGISTRY_FULL`. Light: the
  # codegen's `--bundles` mode takes about a second, and neither crate links
  # trust-tasks-rs.
  cli:
    name: cargo test (trust-tasks-cli, against the whole registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the registry (bundles, index, by-digest store)
        run: |
          registry="$RUNNER_TEMP/registry"
          cargo run -q --release -p trust-tasks-codegen -- --bundles "$registry/specs"
          scripts/write-by-digest-store.sh "$registry/specs"
          echo "TRUST_TASKS_TEST_REGISTRY_FULL=$registry" >> "$GITHUB_ENV"
      - name: cargo test -p trust-tasks-cli
        run: cargo test -p trust-tasks-cli

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
