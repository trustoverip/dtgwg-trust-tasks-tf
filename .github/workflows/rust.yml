name: Rust

on:
  push:
    branches: [main]
  # No `branches:` filter — see the note in ts.yml.
  pull_request:
    paths:
      - "trust-tasks/**"
      - "trust-tasks-rs/**"
      - "trust-tasks-codegen/**"
      - "trust-tasks-https/**"
      - "trust-tasks-didcomm/**"
      # These three were missing, so a change to one of them ran no Rust CI at
      # all. It matters more now: `publication-order` reads every publishable
      # crate's manifest, and a dev-dependency added in an unwatched crate is
      # exactly the edit that guard exists to catch.
      - "trust-tasks-didcomm-v1/**"
      - "trust-tasks-capability-client/**"
      - "trust-tasks-ceremony/**"
      - "trust-tasks-proof/**"
      - "trust-tasks-tsp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "specs/**"
      # GETTING-STARTED.md's Rust is asserted equal to
      # trust-tasks/examples/acl_grant_roundtrip.rs by a test in that crate,
      # so a doc-only edit still has to run cargo test.
      - "GETTING-STARTED.md"
      - ".github/workflows/rust.yml"
      # `cargo deny` reads this, so a change to it must run the job it
      # configures. Without it, the file that decides what the supply-chain
      # check bans is the one file that change cannot be tested by — the same
      # gap as the three crates noted above.
      - "deny.toml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (stable, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Affinidi's TDK pulls in keyring / secret-storage crates whose
      # build scripts probe for `libdbus-1` via pkg-config. Install the
      # dev headers so libdbus-sys finds the system library.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo test (default features)
        run: cargo test --workspace --all-targets
      - name: cargo test (--features validate)
        run: cargo test -p trust-tasks-rs --features validate --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # NOTE: every crate in this workspace ends up declaring MSRV 1.95 —
  # the Affinidi crate family requires it and the workspace resolves
  # under a single Cargo.lock. A separate MSRV job would just retest
  # the same toolchain as `test`. If the workspace ever splits its
  # resolver, a `msrv` job picking a lower toolchain will be
  # appropriate again.

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Where the per-PR version-bump gate used to be ───────────────────────
  #
  # A job here required every changed publishable crate to move its version in
  # the same PR, because publishing was a side effect of merging: a change that
  # merged without a bump would sit on main while crates.io kept serving the
  # old tarball under the same number.
  #
  # release-plz removes the premise. `main` is now legitimately AHEAD of the
  # registry between releases, and the version each crate lands on is decided
  # by the Release PR from the conventional commits that accumulated — not by
  # whoever merged last. The gate would now fail every ordinary PR and force
  # exactly the early release decision this repo moved away from. See
  # RELEASING.md.
  #
  # What replaced its guarantee: release-plz releases every crate whose files
  # changed since its last release tag, so "changed but never republished" is
  # no longer something a human has to remember.

  # The topological publication-order guard, kept.
  #
  # It exists because a dev-dependency edge broke a release: #284 made
  # trust-tasks-proof a DEV-dependency of trust-tasks-https, and although
  # dev-dependencies are stripped for consumers, `cargo publish` still resolves
  # any dev-dependency that carries a `version` field — so it constrains
  # publication order exactly as a normal dependency does. trust-tasks-rs
  # 0.14.0 uploaded and the run then died on
  #   failed to select a version for the requirement `trust-tasks-proof = "^0.13"`.
  #
  # SETTLED, the hard way: release-plz does NOT count dev-dependency edges when
  # it orders the publish. The 0.17.0 release proved it. trust-tasks-rs,
  # -didcomm, -didcomm-v1 and -capability-client uploaded, then cargo tried to
  # package trust-tasks-https before trust-tasks-proof and died on
  #   failed to select a version for the requirement `trust-tasks-proof = "^0.17"`
  # leaving four of eight crates published — and crates.io uploads cannot be
  # undone. The edge had been there since #284 and was survivable only because
  # the requirement named an older, already-published version; lockstep
  # versioning moved it to one that did not exist yet.
  #
  # So the acyclicity tripwire was necessary but not sufficient: a valid order
  # existing does not mean release-plz will USE it. This job now enforces the
  # stronger, actually-sufficient rule — no intra-workspace dev-dependency may
  # carry a `version` field. Dropping `version` makes cargo strip the dep from
  # the published manifest, which removes the ordering constraint entirely
  # rather than relying on release-plz to honour it.
  #
  # The acyclicity check and the derived-order printout are kept below: the
  # first still catches genuine cycles among normal dependencies, and the
  # second is what a failed release gets compared against.
  publication-order:
    name: publication order is satisfiable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Derive the publication order from cargo metadata
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          meta = json.loads(subprocess.run(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"],
              capture_output=True, text=True, check=True).stdout)
          # publish = [] means publish=false; anything else is publishable.
          pkgs = {p["name"]: p for p in meta["packages"] if p.get("publish") != []}

          # Edges: pkg -> the workspace crates it must be published AFTER.
          # Every dependency kind counts, including dev — see the comment above.
          edges = {}
          kinds = {}
          for name, p in pkgs.items():
              deps = set()
              for d in p["dependencies"]:
                  if d["name"] in pkgs:
                      deps.add(d["name"])
                      kinds.setdefault((name, d["name"]), d.get("kind") or "normal")
              edges[name] = deps

          # THE ENFORCING RULE. Any intra-workspace dev-dependency carrying a
          # `version` constrains cargo's publication order while being invisible
          # to release-plz's. Fail before a release can half-complete.
          offenders = []
          for name, p in pkgs.items():
              for d in p["dependencies"]:
                  if d["name"] in pkgs and (d.get("kind") or "normal") == "dev" \
                          and d.get("req") not in (None, "*"):
                      offenders.append((name, d["name"], d["req"]))
          if offenders:
              for who, dep, req in sorted(offenders):
                  print(f"::error file={who}/Cargo.toml::{who} dev-depends on "
                        f"workspace crate {dep} with version \"{req}\". `cargo publish` "
                        f"resolves versioned dev-dependencies from the registry, so this "
                        f"forces {dep} to be published first — but release-plz does not "
                        f"count dev-dependency edges when ordering, so it may not be. "
                        f"That mismatch half-published the 0.17.0 release. Drop the "
                        f"`version` field and keep `path` only: cargo then strips the "
                        f"dependency at publish time and the constraint disappears.")
              sys.exit(1)

          order, seen = [], {}
          def visit(n, stack):
              state = seen.get(n)
              if state == "done":
                  return
              if state == "open":
                  cycle = " -> ".join(stack[stack.index(n):] + [n])
                  print(f"::error::Cycle in the publication graph: {cycle}. "
                        f"No publication order exists; cargo publish cannot succeed. "
                        f"Break it by dropping the `version` field from the dev-dependency in the cycle.")
                  sys.exit(1)
              seen[n] = "open"
              for d in sorted(edges[n]):
                  visit(d, stack + [n])
              seen[n] = "done"
              order.append(n)
          for n in sorted(edges):
              visit(n, [])

          print("Publication order (dependencies first):")
          for i, n in enumerate(order, 1):
              after = ", ".join(f"{d} [{kinds[(n, d)]}]" for d in sorted(edges[n])) or "-"
              print(f"  {i}. {n:<32} after: {after}")
          PY

  codegen-drift:
    name: trust-tasks-codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run codegen
        run: cargo run -p trust-tasks-codegen
      # Codegen emits prettyplease-canonical output; the committed
      # source has additionally been through `cargo fmt`, so normalise
      # here before diffing.
      - name: Format
        run: cargo fmt --all
      # Diff the whole crate, not just `src/specs`. The generator also owns
      # `src/schema_index.rs` and the `[features]` block of `Cargo.toml`
      # (one feature per spec family), and neither was watched — a family
      # added without its feature would have shipped a spec no consumer
      # could enable. Widening is safe because `cargo fmt --all` has already
      # run and the hand-written sources are formatted, so they cannot drift
      # here; anything this diff reports was written by the generator.
      - name: Check for drift
        run: |
          if ! git diff --quiet trust-tasks-rs; then
            echo "::error::Codegen output is stale. Run \`cargo run -p trust-tasks-codegen && cargo fmt --all\` and commit the diff."
            git diff --stat trust-tasks-rs
            git diff trust-tasks-rs
            exit 1
          fi

  package:
    name: cargo package (trust-tasks-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` builds the publish tarball and then compiles a
      # clean copy. That second step catches the bug class where
      # generated code references files outside the crate root via
      # `include_str!` (those paths get excluded from the tarball and
      # the verify compile fails). We exercise both the default feature
      # set and the `validate` feature so anything new that gets
      # `include_str!`-ed is checked end-to-end. Sibling crates depend
      # on `trust-tasks-rs` by path + version and can only be packaged
      # once `trust-tasks-rs` is on crates.io; add them here when that
      # happens.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo package trust-tasks-rs (default features)
        run: cargo package -p trust-tasks-rs
      - name: cargo package trust-tasks-rs (--features validate)
        run: cargo package -p trust-tasks-rs --features validate

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
