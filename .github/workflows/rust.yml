name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "trust-tasks-rs/**"
      - "trust-tasks-codegen/**"
      - "trust-tasks-https/**"
      - "trust-tasks-didcomm/**"
      - "trust-tasks-proof-affinidi/**"
      - "Cargo.toml"
      - "specs/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (stable, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (default features)
        run: cargo test --workspace --all-targets
      - name: cargo test (--features validate)
        run: cargo test -p trust-tasks-rs --features validate --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  msrv:
    name: cargo test (MSRV 1.75 — core crates only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
      - uses: Swatinem/rust-cache@v2
      # trust-tasks-rs and trust-tasks-codegen declare MSRV 1.75. The
      # Affinidi-backed crates (trust-tasks-proof-affinidi, trust-tasks-
      # didcomm) pull in dependencies that require Rust 1.94, so they
      # don't participate in the MSRV job.
      - name: cargo test (trust-tasks-rs, trust-tasks-codegen)
        run: cargo test -p trust-tasks-rs -p trust-tasks-codegen --all-targets
      - name: cargo test (trust-tasks-https)
        run: cargo test -p trust-tasks-https --all-targets

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  codegen-drift:
    name: trust-tasks-codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run codegen
        run: cargo run -p trust-tasks-codegen
      - name: Check for drift
        run: |
          if ! git diff --quiet trust-tasks-rs/src/specs; then
            echo "::error::Codegen output is stale. Run \`cargo run -p trust-tasks-codegen\` and commit the diff."
            git diff trust-tasks-rs/src/specs
            exit 1
          fi

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
