name: Rust

on:
  push:
    branches: [main]
  # No `branches:` filter — see the note in ts.yml.
  pull_request:
    paths:
      - "trust-tasks/**"
      - "trust-tasks-rs/**"
      - "trust-tasks-codegen/**"
      - "trust-tasks-https/**"
      - "trust-tasks-didcomm/**"
      - "trust-tasks-proof/**"
      - "trust-tasks-tsp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "specs/**"
      # GETTING-STARTED.md's Rust is asserted equal to
      # trust-tasks/examples/acl_grant_roundtrip.rs by a test in that crate,
      # so a doc-only edit still has to run cargo test.
      - "GETTING-STARTED.md"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: cargo test (stable, full workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Affinidi's TDK pulls in keyring / secret-storage crates whose
      # build scripts probe for `libdbus-1` via pkg-config. Install the
      # dev headers so libdbus-sys finds the system library.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo test (default features)
        run: cargo test --workspace --all-targets
      - name: cargo test (--features validate)
        run: cargo test -p trust-tasks-rs --features validate --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  # NOTE: every crate in this workspace ends up declaring MSRV 1.95 —
  # the Affinidi crate family requires it and the workspace resolves
  # under a single Cargo.lock. A separate MSRV job would just retest
  # the same toolchain as `test`. If the workspace ever splits its
  # resolver, a `msrv` job picking a lower toolchain will be
  # appropriate again.

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: clippy (--all-features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # A crate that changes and does not move its version never reaches crates.io:
  # `cargo publish` skips a version already published, so the change sits on main
  # while consumers keep resolving the old tarball. main and crates.io then hold
  # the SAME version with DIFFERENT contents, which is worse than an unreleased
  # change because the version number gives no hint.
  #
  # This guard originally watched only `trust-tasks-rs/src/specs`, and that was
  # too narrow: moving the sibling crates' `trust-tasks-rs` requirement to 0.11
  # changed what each of them publishes, without touching a single line of their
  # source. Six crates merged that way and none republished, so downstream
  # consumers pulled tarballs still built against 0.9 and hit E0308 on a
  # duplicated `TrustTask`. Any change to a crate's manifest or source counts.
  version-bump:
    name: version bumped with the crate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require a version bump for every changed publishable crate
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          miss=0
          # Publishable workspace members, as cargo sees them.
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.publish != []) | "\(.name)\t\(.version)\t\(.manifest_path)"' \
            > /tmp/crates.tsv
          while IFS=$'\t' read -r name version manifest; do
            dir=$(dirname "${manifest#$PWD/}")
            git diff --quiet "$BASE"...HEAD -- "$dir" && continue
            before=$(git show "$BASE:$dir/Cargo.toml" 2>/dev/null \
                     | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
            if [ -z "$before" ]; then
              echo "  new  $name ($version)"
              continue
            fi
            if [ "$before" = "$version" ]; then
              echo "  MISS $name: changed but version still $version"
              miss=1
            else
              echo "  ok   $name: $before -> $version"
            fi
          done < /tmp/crates.tsv
          if [ "$miss" = "1" ]; then
            echo "::error::Some changed publishable crates were not version-bumped. cargo publish skips a version already on crates.io, so those changes would never reach a consumer while the registry and main disagree about what that version contains."
            exit 1
          fi
          echo "every changed publishable crate moved its version"

  codegen-drift:
    name: trust-tasks-codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Run codegen
        run: cargo run -p trust-tasks-codegen
      # Codegen emits prettyplease-canonical output; the committed
      # source has additionally been through `cargo fmt`, so normalise
      # here before diffing.
      - name: Format
        run: cargo fmt --all
      # Diff the whole crate, not just `src/specs`. The generator also owns
      # `src/schema_index.rs` and the `[features]` block of `Cargo.toml`
      # (one feature per spec family), and neither was watched — a family
      # added without its feature would have shipped a spec no consumer
      # could enable. Widening is safe because `cargo fmt --all` has already
      # run and the hand-written sources are formatted, so they cannot drift
      # here; anything this diff reports was written by the generator.
      - name: Check for drift
        run: |
          if ! git diff --quiet trust-tasks-rs; then
            echo "::error::Codegen output is stale. Run \`cargo run -p trust-tasks-codegen && cargo fmt --all\` and commit the diff."
            git diff --stat trust-tasks-rs
            git diff trust-tasks-rs
            exit 1
          fi

  package:
    name: cargo package (trust-tasks-rs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo package` builds the publish tarball and then compiles a
      # clean copy. That second step catches the bug class where
      # generated code references files outside the crate root via
      # `include_str!` (those paths get excluded from the tarball and
      # the verify compile fails). We exercise both the default feature
      # set and the `validate` feature so anything new that gets
      # `include_str!`-ed is checked end-to-end. Sibling crates depend
      # on `trust-tasks-rs` by path + version and can only be packaged
      # once `trust-tasks-rs` is on crates.io; add them here when that
      # happens.
      - name: Install libdbus-1-dev
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: cargo package trust-tasks-rs (default features)
        run: cargo package -p trust-tasks-rs
      - name: cargo package trust-tasks-rs (--features validate)
        run: cargo package -p trust-tasks-rs --features validate

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
