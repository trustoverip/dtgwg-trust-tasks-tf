[package]
name = "trust-tasks-tsp"
version = "0.35.2"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "ToIP Trust Spanning Protocol (TSP) transport binding for the Trust Tasks framework, built on affinidi-tsp. Provides pack/unpack helpers and a TransportHandler that maps the authenticated VID sender into the framework's §4.8.1 precedence."
keywords = ["trust-tasks", "tsp", "affinidi", "vid"]
categories = ["network-programming", "cryptography"]
publish = true

[dependencies]
# The runtime only. This crate uses no generated specification module, and
# default features would switch on every one of them for every application
# that depends on it, including one that generates only the tasks it pins.
trust-tasks-rs = { path = "../trust-tasks-rs", version = "0.35", default-features = false }
affinidi-tsp = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
