# git-cliff — turns conventional commits into changelog entries.
#
# Read by release-plz when it builds the crates Release PR (see
# release-plz.toml), and by scripts/release-ts-pr.sh for the npm package, so
# both halves of a release read identically.
#
# The commit message IS the changelog entry. PRs here squash-merge, so the PR
# TITLE becomes the commit subject and that subject is what a consumer of these
# crates reads on crates.io. `.github/workflows/commit-lint.yml` checks it.
#
# The body is included, not just the subject. Commits in this repo carry real
# explanation — what changed, why, and what it breaks — and throwing that away
# in favour of a one-line summary would make the changelog worse than the git
# history it is generated from.

[changelog]
header = """
# Changelog

Notable changes to the published packages. Generated from conventional commits
by [git-cliff](https://git-cliff.org) when a release is cut — do not edit by
hand.
"""

body = """
{% if version %}\
## {% if release_link %}[{{ version | trim_start_matches(pat="v") }}]({{ release_link }})\
{% else %}{{ version | trim_start_matches(pat="v") }}{% endif %} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.body %}

{{ commit.body | indent(prefix="  ") }}
{% endif %}\
{% endfor %}
{% endfor %}\n
"""

trim = true

[git]
conventional_commits = true
# A commit that is not conventional still appears, rather than vanishing from
# the record. `filter_unconventional = true` would silently drop it, and a
# changelog that quietly omits changes is worse than an untidy one.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true

commit_parsers = [
  # Release commits carry no product change.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^Merge (branch|pull request)", skip = true },

  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },

  # `spec` is NOT a conventional-commit type, but it is this repo's most
  # common one: `spec(vault):`, `spec(acl):` — a change to a specification
  # under `specs/`, which regenerates the bindings in every published library.
  # Without this parser those commits fall through to "Other", which reads as
  # if the most important category of change here were an afterthought.
  #
  # ⚠️ THIS GROUPS THEM; IT DOES NOT SIZE THEM. release-plz derives the bump
  # from the conventional-commit TYPE, and an unrecognised type is scored as a
  # patch. That is right for an in-place schema edit and wrong for a new spec
  # family, which is additive API surface. Use `feat(spec-name):` when adding a
  # family, and `spec(...)` for edits within one. cargo-semver-checks is the
  # backstop for a genuine break — see release-plz.toml.
  { message = "^spec", group = "Specifications" },

  { message = "^perf", group = "Performance" },
  { message = "^security", group = "Security" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  # `site` is ours too: a change to the registry website under `website/`.
  # It reaches no published package, so it only shows up in "Other" today;
  # naming it keeps that from being confusing.
  { message = "^site", group = "Website" },
  { message = "^test", skip = true },
  { message = "^ci", group = "Build & CI" },
  { message = "^build", group = "Build & CI" },
  { message = "^chore", skip = true },

  # Anything else still lands somewhere visible.
  { message = ".*", group = "Other" },
]

filter_commits = false
# No `tag_pattern`: release-plz decides which commits belong to which crate
# release and drives git-cliff per package. A pattern here would second-guess
# it. scripts/release-ts-pr.sh passes an explicit commit range instead.
topo_order = false
sort_commits = "newest"
