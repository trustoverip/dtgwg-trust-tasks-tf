[package]
name = "trust-tasks-codegen"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Code generator that emits Rust payload types for trust-tasks-rs from the specs/ registry."
publish = false

[[bin]]
name = "trust-tasks-codegen"
path = "src/main.rs"

[dependencies]
# The per-module generator: the same code an application's build.rs runs on a
# vendored bundle; and, with `publish`, the bundle builder (front matter,
# `$ref` inlining, lifecycles) that `trust-tasks registry build` shares.
# Path-only, because this crate is never published.
trust-tasks-build = { path = "../trust-tasks-build", features = ["publish"] }
anyhow = "1"
serde_json = "1"
toml = "1"
# The conformance tests are built as tokens and printed; the schemas go
# through typify in `trust-tasks-build`, not here.
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
walkdir = "2"
