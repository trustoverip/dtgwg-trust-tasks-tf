[package]
name = "trust-tasks-codegen"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Code generator that emits Rust payload types for trust-tasks-rs from the specs/ registry."
publish = false

[[bin]]
name = "trust-tasks-codegen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"
typify = "0.6"
# Pinned to 0.8 by `typify`: this crate hands typify a `schemars::RootSchema`,
# so our schemars major must match typify's. typify (through 0.7) still depends
# on schemars 0.8, so schemars 1.x is not adoptable here until typify migrates.
# This is a `publish = false` build tool with no security advisory on schemars.
schemars = "0.8"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
quote = "1"
heck = "0.5"
walkdir = "2"
