[package]
name = "trust-tasks-codegen"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
description = "Code generator that emits Rust payload types for trust-tasks-rs from the specs/ registry."
publish = false

[[bin]]
name = "trust-tasks-codegen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
typify = "0.5"
schemars = "0.8"
prettyplease = "0.2"
syn = { version = "2", features = ["full"] }
proc-macro2 = "1"
quote = "1"
heck = "0.5"
walkdir = "2"
