[package]
name = "trust-tasks-rs"
version = "0.39.0"
edition = "2021"
# Effective MSRV is constrained by the workspace's transitive deps and
# the Affinidi crates (`affinidi-data-integrity`, `affinidi-messaging-*`)
# pulled in by the sibling binding crates. Aligning here keeps the
# workspace honest under shared resolution; trust-tasks-rs itself uses
# no 1.95-specific features and can in principle build on older
# toolchains outside this workspace.
rust-version = "1.95"
description = "Reference Rust library for the Trust Tasks framework — transport-agnostic, JSON-based descriptions of verifiable work between parties."
license = "Apache-2.0"
repository = "https://github.com/trustoverip/dtgwg-trust-tasks-tf"
homepage = "https://trusttasks.org/"
documentation = "https://docs.rs/trust-tasks-rs"
readme = "README.md"
keywords = ["trust-tasks", "trustoverip", "did", "json-schema", "verifiable"]
categories = ["data-structures", "encoding"]
publish = true
# The generated per-spec conformance tests (one file per specification version
# with examples) run in this
# repository's CI and nowhere else: a consumer never compiles another crate's
# integration tests. Shipping them took the .crate to 9.96 MB of crates.io's
# 10 MB upload limit.
#
# CHANGELOG.md (~650 KB, and growing with every release) is excluded for the
# same reason: the crate grew back to 9.8 MiB (#1097). It is published as each
# crate's GitHub Release and lives in the repository; the README links there.
# The `package` job in rust.yml fails above 9.9 MiB and warns above 9.5 MiB.
exclude = ["tests/conformance/", "CHANGELOG.md"]

[features]
# Enables runtime payload validation against the JSON Schema bundled with
# each generated spec module. Pulls in the `jsonschema` crate.
validate = ["dep:jsonschema"]

# Everything below is written by `cargo run -p trust-tasks-codegen` from what
# is on disk under `specs/`. Do not hand-edit: a family added to the registry
# gets its feature from the generator, and
# `tests/spec_feature_manifest.rs` fails if this table and `specs/` disagree.
# trust-tasks-codegen:begin
# One feature per top-level spec family, and the `all-specs` umbrella. `default`
# is empty (#1102): every prebuilt module is deprecated, so a plain dependency
# compiles the runtime alone. Opt in with `features = ["vault"]` and
# friends, or `features = ["all-specs"]` for every family.
default = []
all-specs = [
    "acl",
    "audit",
    "auth",
    "backup",
    "chat",
    "config",
    "confirm",
    "consent",
    "credential-exchange",
    "device",
    "did-management",
    "external",
    "git-ns",
    "git-trust",
    "governance",
    "keys",
    "messaging",
    "notifications",
    "peer-check",
    "persona",
    "policy",
    "process-attestation",
    "provision",
    "push",
    "registry",
    "rooms",
    "sync",
    "task-consent",
    "vault",
    "vetting",
    "voting",
    "vrc",
    "vta",
    "vtc",
    "vtn",
    "webvh",
    "witness",
]
acl = []
audit = []
auth = []
backup = []
chat = []
config = []
confirm = []
consent = []
credential-exchange = []
device = []
did-management = []
external = []
git-ns = []
git-trust = []
governance = []
keys = []
messaging = []
notifications = []
peer-check = []
persona = []
policy = []
process-attestation = []
provision = []
push = []
registry = []
rooms = []
sync = []
task-consent = []
vault = []
vetting = []
voting = []
vrc = []
vta = []
vtc = []
vtn = []
webvh = []
witness = []
# trust-tasks-codegen:end

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
async-trait = "0.1"
jsonschema = { version = "0.49", default-features = false, optional = true }
# Used by codegen-emitted `FromStr` impls for newtypes whose underlying
# JSON Schema declares a `pattern`. Pulled in transparently because the
# typify-generated code references `::regress::Regex` directly.
regress = "0.12"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
proptest = "1"

# Not `all-features`: every spec family is over a thousand generated modules,
# all deprecated (they are generated per application now), and documenting
# them costs more memory than docs.rs gives a build. The runtime, `validate`,
# and one family as a specimen of what generated code looks like.
[package.metadata.docs.rs]
features = ["validate", "acl"]
rustdoc-args = ["--cfg", "docsrs"]
