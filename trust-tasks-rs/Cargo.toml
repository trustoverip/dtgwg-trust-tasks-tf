[package]
name = "trust-tasks-rs"
version = "0.18.0"
edition = "2021"
# Effective MSRV is constrained by the workspace's transitive deps and
# the Affinidi crates (`affinidi-data-integrity`, `affinidi-messaging-*`)
# pulled in by the sibling binding crates. Aligning here keeps the
# workspace honest under shared resolution; trust-tasks-rs itself uses
# no 1.95-specific features and can in principle build on older
# toolchains outside this workspace.
rust-version = "1.95"
description = "Reference Rust library for the Trust Tasks framework — transport-agnostic, JSON-based descriptions of verifiable work between parties."
license = "Apache-2.0"
repository = "https://github.com/trustoverip/dtgwg-trust-tasks-tf"
homepage = "https://trusttasks.org/"
documentation = "https://docs.rs/trust-tasks-rs"
readme = "README.md"
keywords = ["trust-tasks", "trustoverip", "did", "json-schema", "verifiable"]
categories = ["data-structures", "encoding"]
publish = true

[features]
# Enables runtime payload validation against the JSON Schema bundled with
# each generated spec module. Pulls in the `jsonschema` crate.
validate = ["dep:jsonschema"]

# Everything below is written by `cargo run -p trust-tasks-codegen` from what
# is on disk under `specs/`. Do not hand-edit: a family added to the registry
# gets its feature from the generator, and
# `tests/spec_feature_manifest.rs` fails if this table and `specs/` disagree.
# trust-tasks-codegen:begin
# One feature per top-level spec family. `default` is the umbrella, so an
# unconfigured consumer gets every family exactly as before; the saving is
# `default-features = false, features = ["vault"]` and friends.
default = ["all-specs"]
all-specs = [
    "acl",
    "audit",
    "auth",
    "chat",
    "config",
    "confirm",
    "consent",
    "credential-exchange",
    "device",
    "did-management",
    "git-trust",
    "governance",
    "keys",
    "messaging",
    "policy",
    "provision",
    "push",
    "registry",
    "rooms",
    "sync",
    "task-consent",
    "vault",
    "vrc",
    "vta",
    "vtc",
    "webvh",
    "witness",
]
acl = []
audit = []
auth = []
chat = []
config = []
confirm = []
consent = []
credential-exchange = []
device = []
did-management = []
git-trust = []
governance = []
keys = []
messaging = []
policy = []
provision = []
push = []
registry = []
rooms = []
sync = []
task-consent = []
vault = []
vrc = []
vta = []
vtc = []
webvh = []
witness = []
# trust-tasks-codegen:end

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
thiserror = "2"
async-trait = "0.1"
jsonschema = { version = "0.46", default-features = false, optional = true }
# Used by codegen-emitted `FromStr` impls for newtypes whose underlying
# JSON Schema declares a `pattern`. Pulled in transparently because the
# typify-generated code references `::regress::Regex` directly.
regress = "0.11"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
proptest = "1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
